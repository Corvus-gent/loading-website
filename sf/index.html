<body>
  <main class="postcard">
    <section class="letter" aria-labelledby="heading">
      <h1 id="heading">Gabriel in <span>SF</span></h1>
      <p>Homeless-maxxing in San Francisco. Want to hear the story? Let's meet.</p>
      <nav aria-label="Contact Gabriel">
        <a class="email" href="mailto:gabriel@corvus.gent?subject=Let's%20meet%20in%20SF">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="m3 6 9 7 9-7"/></svg>
          Send me an email
        </a>
        <a href="https://corvus.gent/links/gabe" target="_blank" rel="noopener noreferrer">
          Look at my Linktree <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18 18 6M7 6h11v11"/></svg>
        </a>
      </nav>
    </section>

    <div class="sky" aria-hidden="true">
      <svg class="stars" viewBox="0 0 1000 360" preserveAspectRatio="xMidYMin slice">
        <g fill="#d4dbd5"><circle cx="45" cy="36" r=".8"/><circle cx="120" cy="144" r=".55"/><circle cx="221" cy="45" r=".7"/><circle cx="336" cy="79" r="1"/><circle cx="406" cy="28" r=".5"/><circle cx="477" cy="160" r=".9"/><circle cx="521" cy="55" r=".75"/><circle cx="569" cy="100" r="1.2"/><circle cx="592" cy="93" r=".55"/><circle cx="676" cy="27" r="1"/><circle cx="738" cy="171" r=".75"/><circle cx="783" cy="55" r=".55"/><circle cx="864" cy="137" r=".8"/><circle cx="948" cy="36" r=".95"/><circle cx="970" cy="196" r=".55"/></g>
      </svg>
      <div class="moon"></div>
    </div>
    <div class="bay">
      <img class="bridge" src="/sf/bridge.svg" width="1200" height="500" alt="The Golden Gate Bridge at night, its copper towers rising through sea fog.">
      <button class="raven" type="button" aria-label="Let Corvus fly" aria-describedby="caw" hidden>
        <img src="/sf/raven.svg" alt="" width="40" height="30">
        <span id="caw" class="caw" role="tooltip" hidden>Caw. — Corvus</span>
      </button>
      <noscript><img class="still-raven" src="/sf/raven.svg" alt="Corvus perched on a bridge cable"></noscript>
    </div>
    <svg class="bluff" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">
      <path fill="#182b32" d="m0 30 28-5 17 6 36-1 43 7 39-1 35 8 43 0 28 7 33-1 68 17 29 0 68 18 62 7 59 12 97 8 80 8H0z"/>
      <path fill="#0e1b22" d="m0 39 38-4 22 4 33-3 26 4 41-2 29 7 28-2 28 9 40 2 44 9 19 7 26-1 64 19 33 3 57 14 43 5 78 10H0z"/>
      <g fill="none" stroke="#40524c" stroke-width="1" opacity=".75"><path d="m28 37-2-9m1 5-6-4m7 5 3-8m106 12 3-7m-1 4 5-4m-68 7-2-5m152 12-2-7m2 5 4-3m92 20 3-5"/></g>
    </svg>
    <div class="philosopher">
      <div class="beam" aria-hidden="true"></div>
      <div class="halo" aria-hidden="true"></div>
      <img class="diogenes" src="/sf/diogenes.svg" width="200" height="220" alt="Diogenes holds his lantern out over the bay.">
      <button class="lantern" type="button" aria-label="Reveal the lantern inscription" aria-controls="inscription" aria-expanded="false" hidden></button>
      <p id="inscription" class="inscription" hidden>Diogenes searched Athens for an honest man. I'm searching SF for an honest founder.</p>
    </div>
    <footer><a href="/privacy/">privacy</a></footer>
  </main>

  cw = W<640 ? 8 : 10; ch=Math.round(cw*1.5); cols=Math.ceil(W/cw); rows=Math.ceil(H/ch);
  prevG=new Array(cols*rows).fill(''); prevC=new Array(cols*rows).fill('');
  noise=new Float32Array(cols*rows).map(()=>Math.random()); scramble=new Float32Array(cols*rows);
  ctx.font=`600 ${Math.round(ch*.82)}px ui-monospace,Menlo,monospace`; ctx.textBaseline='top';
  ctx.fillStyle='#0d0a12'; ctx.fillRect(0,0,W,H);
  layoutText(lastText, true);
}
// stamp text into mask: 1=title, 2=digit
let lastText='', titleText='GAME-DEV';
function stamp(str, cy, scaleX, scaleY, kind){
  const w=str.length*6-1, x0=Math.floor(cols/2 - w*scaleX/2);
  for(let k=0;k<str.length;k++){ const g=F[str[k]]||F[' '];
    for(let fy=0;fy<7;fy++) for(let fx=0;fx<5;fx++) if(g[fy][fx]==='1')
      for(let sy=0;sy<scaleY;sy++) for(let sx=0;sx<scaleX;sx++){
        const c=x0+(k*6+fx)*scaleX+sx, r=cy+fy*scaleY+sy; if(c>=0&&r>=0&&c<cols&&r<rows) mask[r*cols+c]=kind; } }
  return {x0, w:w*scaleX};
}
let digitBox={x0:0,w:0,y:0,h:0};
function layoutText(text, force){
  if(!force && text===lastText) return; lastText=text;
  mask=new Uint8Array(cols*rows);
  const sx=Math.max(1,Math.floor(cols*0.74/29)), sy=Math.max(1,Math.round(sx*cw/ch));   // 5 chars of 6 = 29 font px wide
  const dh=7*sy, ty=Math.floor(rows*0.47 - dh/2);
  const tsx=Math.max(1,Math.floor(sx/3)), tsy=Math.max(1,Math.round(tsx*cw/ch));
  const twoLines = titleText.length*6*tsx > cols*.9;
  const titleTop = ty - (twoLines?2:1)*7*tsy - (twoLines?2:0) - Math.max(3,sy*2);
  if(twoLines){ stamp('GAME', titleTop, tsx, tsy, 1); stamp('DEV', titleTop+7*tsy+2, tsx, tsy, 1); }
  else stamp(titleText, titleTop, tsx, tsy, 1);
  const b=stamp(text, ty, sx, sy, 2);
  // dark halo (kind 3) around title + digits so the numbers read clearly
  const pad=Math.max(2,sx), top=titleTop-pad, bot=ty+dh+pad, l=b.x0-pad*2, rr=b.x0+b.w+pad*2;
  for(let r=Math.max(0,top);r<Math.min(rows,bot);r++) for(let c=Math.max(0,l);c<Math.min(cols,rr);c++){ const i=r*cols+c; if(!mask[i]) mask[i]=3; }
  digitBox={x0:b.x0*cw, w:b.w*cw, y:ty*ch, h:dh*ch};
}

/* ===== countdown ===== */
const when=document.getElementById('when'), sr=document.getElementById('sr-time');
const fmtGent=new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Brussels'});
let reloadAt=0;
function countdown(){
  const left=TARGET-Date.now();
  if(isNaN(TARGET)) return 'LOADING';
  if(left<=0){ if(!reloadAt) reloadAt=Date.now()+20000; if(Date.now()>reloadAt) location.reload(); return 'SOON'; }
  const s=Math.ceil(left/1000), m=Math.floor(s/60), ss=s%60;
  return (m>99?'99':String(m).padStart(2,'0'))+':'+String(ss).padStart(2,'0');
}
function updateTexts(){
  const t=countdown();
  if(!isNaN(TARGET)){
    when.textContent = TARGET>Date.now() ? `gabe@corvus:~$ ./game-dev --opens ${fmtGent.format(TARGET)} gent` : 'gabe@corvus:~$ dropping any second…';
    sr.textContent = TARGET>Date.now() ? `Opens at ${fmtGent.format(TARGET)} Gent time.` : 'Opening any second now.';
  }
  layoutText(t==='SOON'?'SOON':t==='LOADING'?'LOAD':t);
}

/* ===== mouse = lantern + scramble ===== */
function onMove(e){ const p=e.touches?e.touches[0]:e; if(!p||(!p.clientX&&!p.clientY)) return;
  const nx=p.clientX/cw, ny=p.clientY/ch, speed=Math.hypot(nx-mx,ny-my); mx=nx; my=ny; lastMove=performance.now();
  if(reduced) return;
  const R=Math.min(10,3+speed*1.5);
  for(let r=Math.max(0,Math.floor(my-R));r<Math.min(rows,my+R);r++) for(let c=Math.max(0,Math.floor(mx-R*1.5));c<Math.min(cols,mx+R*1.5);c++){
    const d=Math.hypot((c-mx)/1.5,r-my); if(d<R) scramble[r*cols+c]=Math.max(scramble[r*cols+c], 1-d/R); }
}
addEventListener('pointermove',onMove,{passive:true}); addEventListener('touchmove',onMove,{passive:true});
addEventListener('resize',resize);

/* ===== render ===== */
function frame(now){
  const t=now/1000, idle=now-lastMove>2500;
  if(idle && !reduced){ mx=cols*(.5+.32*Math.sin(t*.21)); my=rows*(.5+.3*Math.sin(t*.29)); }   // lantern drifts when idle
  const R=Math.max(cols,rows)*.11;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const i=r*cols+c, k=mask[i], dx=(c-mx)/1.5, dy=r-my, light=Math.exp(-(dx*dx+dy*dy)/(R*R));
    let g, col;
    const sc=scramble[i]; if(sc>0) scramble[i]=Math.max(0,sc-.06);
    if(sc>.15){ g=SCR[(Math.random()*SCR.length)|0]; col= k===2?COL.digit[2]:COL.hot; }
    else if(k===2){ const n=noise[i]; g=DENSE[(n*DENSE.length)|0]; col=COL.digit[light>.35?2:(n>.5?1:0)]; }
    else if(k===1){ g=DENSE[(noise[i]*DENSE.length)|0]; col=light>.4?'#e9e2f5':COL.title; }
    else {
      if(k===3){ g=' '; col=''; }
      else {
      const v=noise[i]*noise[i]*.22 + light*.62 + (reduced?0:.03*Math.sin(t*.7+noise[i]*20));
      if(v<.2){ g=v<.08?' ':SPARSE[(v/.2*SPARSE.length)|0]; col=COL.bg[(noise[i]*3)|0]; }
      else if(v<.5){ g=MID[((v-.2)/.3*MID.length)|0]; col=COL.mid[v>.38?1:0]; }
      else { g=MID[MID.length-1-((noise[i]*2)|0)]; col=COL.title; }
      }
    }
    if(g===prevG[i]&&col===prevC[i]) continue;
    prevG[i]=g; prevC[i]=col;
    ctx.fillStyle='#0d0a12'; ctx.fillRect(c*cw,r*ch,cw,ch);
    if(g!==' '){ ctx.fillStyle=col; ctx.fillText(g,c*cw,r*ch+1); }
  }
}

/* ===== Wing flies in, then perches above the countdown ===== */
const wing=document.getElementById('wing'); const t0=performance.now();
function wingPos(now){
  const ww=wing.offsetWidth, tx=digitBox.x0+digitBox.w-ww*.7, ty=digitBox.y-ww*1.05;
  const u=reduced?1:Math.min(1,(now-t0)/2200), e=1-Math.pow(1-u,3);
  const sx=-ww*1.5, sy=H*.15;
  const x=sx+(tx-sx)*e, y=sy+(ty-sy)*e - Math.sin(u*Math.PI)*H*.12 + (u>=1&&!reduced?Math.sin(now/420)*4:0);
  wing.style.transform=`translate(${x}px,${y}px)`; wing.style.left='0'; wing.style.top='0';
}

/* ===== loop: 30 fps, pause when hidden ===== */
let last=0, raf=0;
function loop(now){
  raf=0;
  if(!document.hidden && now-last>=33){ last=now; updateTexts(); frame(now); wingPos(now); }
  if(!reduced&&!document.hidden) raf=requestAnimationFrame(loop);
}
resize(); updateTexts(); frame(performance.now()); wingPos(performance.now());
if(reduced) setInterval(()=>{if(!document.hidden){updateTexts(); frame(performance.now()); wingPos(performance.now());}},1000); else raf=requestAnimationFrame(loop);
document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);raf=0;if(!document.hidden){if(reduced){updateTexts();frame(performance.now());wingPos(performance.now());}else raf=requestAnimationFrame(loop);}});
})();
</script>
</main></body>

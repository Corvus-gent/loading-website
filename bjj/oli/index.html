<body class="site-shell"><!-- SITE_NAV --><nav class="site-nav" aria-label="Corvus rooms" data-site-shell><a class="site-mark" href="/" aria-label="Corvus home"><img data-weekly-logo src="/assets/cube/day-1-viza2zpk.svg" width="24" height="24" alt="">corvus</a><span class="site-nav-rooms"><a href="/gabe/">Gabe</a><a href="/legion/">Legion</a><a href="/quests/">(Side) Quests</a><a href="/daily/">Daily</a><a href="/stats/map/">Stats</a></span><button class="site-search-button" data-site-search aria-label="Find a page">/ search</button></nav><p class="site-back" data-site-shell><a href="/gabe/">← gabe</a></p><!-- /SITE_NAV -->
  <main class="review">
    <header class="room-header">
      <h1>Oli’s review room</h1>
      <p>Private review — don't share or repost</p>
    </header>

    <form id="gate" class="card gate" hidden>
      <label for="passcode">Review passcode</label>
      <div class="gate-controls">
        <input id="passcode" type="password" autocomplete="current-password" maxlength="256" required>
        <button class="primary">Unlock</button>
      </div>
    </form>
    <p id="gate-note" class="notice" role="status">Checking access…</p>

    <section id="room" hidden>
      <div class="cuts" role="group" aria-label="Choose a cut">
        <button type="button" data-cut="en" aria-pressed="true">Trailer EN</button>
        <button type="button" data-cut="zh" aria-pressed="false">Trailer <span lang="zh">中文</span></button>
        <button type="button" data-cut="long" aria-pressed="false">YouTube long-form</button>
      </div>
      <div class="room-grid">
        <section class="card playback" aria-label="Cut preview">
          <div id="preview" class="preview">
            <video id="player" controls playsinline preload="metadata" aria-label="Review video" hidden></video>
            <p id="placeholder">Loading cut…</p>
          </div>
          <div id="version-details" class="version-details" hidden>
            <select id="version" aria-label="Cut version"></select>
            <p id="changelog"></p>
          </div>
        </section>
        <section class="card conversation" aria-labelledby="editor">
          <h2 id="editor">Editor</h2>
          <div id="history" role="log" aria-label="Edit conversation"></div>
          <form id="composer">
            <label class="sr-only" for="note">Message the editor</label>
            <textarea id="note" rows="2" maxlength="3000" placeholder="What would you change?"></textarea>
            <div id="attachments" class="attachments" hidden></div>
            <div class="tools">
              <button type="button" id="mic" aria-label="Dictate a note" title="Dictate a note">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11v1a7 7 0 0 0 14 0v-1M12 19v3m-3 0h6"/></svg>
              </button>
              <button type="button" id="photo" aria-label="Attach a photo" title="Attach a photo">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9" r="1.5"/><path d="m3 17 5-4 4 3 4-5 5 5"/></svg>
              </button>
              <input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
              <button type="button" id="timestamp" aria-label="Attach current video time" disabled>@ 0:00</button>
              <button class="primary" id="send">Send</button>
            </div>
            <p id="notice" class="notice" role="status"></p>
          </form>
        </section>
      </div>
    </section>
  </main>

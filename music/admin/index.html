<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="color-scheme" content="dark"><title>Manage music | corvus.gent</title><link rel="icon" href="/logo.png"><link rel="stylesheet" href="/styles.css?v=c5cabf3f1a64"><link rel="stylesheet" href="/music/music.css?v=181ca39c23d3"><link rel="stylesheet" href="/privacy/privacy.css?v=158032e36fdb"><meta name="referrer" content="no-referrer">
<!-- PLETHORA_HEAD --><link rel="stylesheet" href="/plethora/promo.css?v=20261108p1"><!-- /PLETHORA_HEAD --></head><body class="music-page"><main class="music-shell">
<header class="music-top"><a href="/music/">← music</a><div id="lang-switcher" class="lang-switcher"></div><button id="logout" type="button" hidden data-i18n="m.logout">log out</button></header>
<div class="admin-heading"><p class="eyebrow">GABE’S COLLECTION / ADMIN</p><h1 data-i18n="m.manage">manage collection</h1><p class="muted" data-i18n="m.loginHint">only gabriel@corvus.gent can edit this collection.</p></div>
<div id="notice" class="notice" role="status" aria-live="polite"></div>
<section id="login" class="login-box" hidden><form id="login-email"><label class="sr-only" for="email">email</label><input id="email" type="email" required autocomplete="email" value="gabriel@corvus.gent"><button type="submit" data-i18n="m.sendCode">send login code</button></form><form id="login-code" hidden><label class="sr-only" for="code" data-i18n="m.code">6-digit code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required data-i18n-placeholder="m.code"><button type="submit" data-i18n="m.enter">log in</button></form><button id="resend" type="button" hidden data-i18n="m.resend">use another code</button></section>
<section id="admin" hidden><p class="muted" data-i18n="m.adminHint">drag the handles, then save. changes go live immediately.</p>
<form id="add-track" class="admin-add"><label class="sr-only" for="add-url" data-i18n="m.link">song link</label><input id="add-url" type="url" placeholder="https://music.apple.com/… / https://open.spotify.com/…" required><label class="sr-only" for="add-genre" data-i18n="m.genre">genre</label><select id="add-genre"></select><label class="sr-only" for="add-position" data-i18n="m.position">position</label><input id="add-position" class="position-input" type="number" min="1" value="1" required><button class="primary" type="submit" data-i18n="m.add">add to collection</button></form>
<div class="admin-toolbar"><button id="save-order" class="primary" disabled data-i18n="m.saveOrder">save order</button><small id="order-status"></small><button id="reload" type="button" data-i18n="m.refresh">reload collection</button></div>
<ol id="admin-tracks" class="track-list"></ol><section class="admin-suggestions"><h2 data-i18n="m.suggestions">your suggestions</h2><ol id="admin-suggestions" class="track-list"></ol></section></section>
<footer><a href="/music/">← music</a> <a href="/privacy/" data-privacy-link>privacy</a></footer></main>
<dialog id="edit-dialog"><form id="edit-form" class="edit-form"><label><span data-i18n="m.songTitle">song title</span><input name="title" maxlength="180" required></label><label><span data-i18n="m.artist">artist</span><input name="artist" maxlength="180"></label><label><span data-i18n="m.genre">genre</span><select name="genre" id="edit-genre"></select></label><label><span data-i18n="m.note">note / fun fact</span><textarea name="note" maxlength="1000"></textarea></label><label><span data-i18n="m.attachLink">attach or replace a Spotify / Apple Music link</span><input name="link" type="url"></label><p id="edit-error" role="status"></p><div class="dialog-actions"><button id="cancel-edit" type="button" data-i18n="m.close">close</button><button type="submit" class="primary" data-i18n="m.save">save changes</button></div></form></dialog>

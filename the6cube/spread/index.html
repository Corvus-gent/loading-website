<style>

:root{--bg:#060509;--line:#2c1f45;--violet:#7a5cb0;--lav:#b4a0d6;--gold:#ffd76a;--cream:#efe7d2;--dim:rgba(239,231,210,.55);--serif:'Bodoni Moda',Didot,Georgia,serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}

[hidden]{display:none!important}

body{margin:0;padding-top:28px;overflow:hidden}
#cv{position:fixed;inset:28px 0 0;width:100%;height:calc(100% - 28px);display:block;touch-action:none;cursor:grab}

header a,header button{pointer-events:auto;text-decoration:none;color:inherit}
.title{position:fixed;top:74px;left:20px;z-index:4;pointer-events:none;max-width:min(440px,calc(100% - 40px))}
.title h1{font:italic 400 clamp(30px,4.2vw,54px)/1.05 var(--serif);margin:0 0 8px}
.title h1 em{color:var(--gold)}
.title p{font:12px/1.55 var(--mono);color:var(--dim);margin:0}
.panel{position:fixed;right:16px;top:74px;z-index:5;width:290px;max-height:calc(100% - 170px);overflow:auto;background:rgba(10,8,16,.78);border:1px solid var(--line);border-radius:16px;padding:16px 16px 12px;backdrop-filter:blur(10px)}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px solid rgba(44,31,69,.6)}
.stat b{font:700 26px/1 var(--serif);color:var(--cream);font-variant-numeric:tabular-nums}
.stat b.g{color:var(--gold)}

.dock button{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#1a1206;font:13px system-ui;flex:none}
.dock button:focus-visible,.panel button:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
.dock input{flex:1;accent-color:var(--gold)}
.dock time{font:11px var(--mono);color:var(--dim);white-space:nowrap;min-width:118px;text-align:right}

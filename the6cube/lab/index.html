<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="Een speelbare Rubiks kubus als onderzoeksinstrument: twee paden, één eindstand, en een reproduceerbaar scramble-experiment.">
  <title>A pattern · The 6 Cube · Corvus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/the6cube/style.css">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
  <script type="module" src="/the6cube/cube.js"></script>
</head>
<body>
  <main>
    <header>
      <a class="brand" href="/"><img src="/assets/cube/day-1-viza2zpk.svg" alt="" width="30" height="30"><span>Corvus</span></a><a href="/the6cube/" style="font:12px ui-monospace,monospace;color:#b4a0d6;text-decoration:none">← 🏛️ portal</a>
      
    </header>

    <div class="intro">
      <h1>Cube<span>.</span></h1>
      <p data-i18n="intro"></p>
    </div>

    <section id="proof" class="panel" aria-labelledby="proof-title">
      <div class="section-head">
        <div><p class="eyebrow">§1</p><h2 id="proof-title" data-i18n="proof_title"></h2></div>
        <button class="primary" id="compare" type="button" data-i18n="compare"></button>
      </div>
      <div class="lanes" id="lanes">
        <figure class="lane a">
          <figcaption><span data-i18n="lane_a"></span> <ol class="chips" id="chips-a"></ol></figcaption>
          <canvas id="lane-a" width="520" height="420" role="img" aria-labelledby="sum-a"></canvas>
          <p class="sig" id="sum-a"></p>
        </figure>
        <div class="equals" aria-hidden="true">=</div>
        <figure class="lane b">
          <figcaption><span data-i18n="lane_b"></span> <ol class="chips" id="chips-b"></ol></figcaption>
          <canvas id="lane-b" width="520" height="420" role="img" aria-labelledby="sum-b"></canvas>
          <p class="sig" id="sum-b"></p>
        </figure>
      </div>
      <dl class="verdict" id="verdict" aria-live="polite">
        <div><dt data-i18n="v_turns"></dt><dd id="v-turns">3 vs 1</dd></div>
        <div><dt data-i18n="v_dist"></dt><dd id="v-dist">—</dd></div>
        <div><dt data-i18n="v_sig"></dt><dd id="v-sig">—</dd></div>
      </dl>
      <div class="row proof-controls">
        <button id="p-replay" type="button" data-i18n="replay"></button>
        <button id="p-step" type="button" data-i18n="step"></button>
        <label class="scrub"><span data-i18n="scrub"></span><input id="p-scrub" type="range" min="0" max="300" value="0" step="1"></label>
        <output id="p-at" class="mono"></output>
        <button id="p-take" type="button" data-i18n="take"></button>
        <button id="p-tree" type="button" data-i18n="in_tree"></button>
      </div>
      <details><summary data-i18n="why"></summary><p data-i18n="why_body"></p></details>
    </section>

    <section id="experiment" class="panel" aria-labelledby="exp-title">
      <div class="section-head">
        <div><p class="eyebrow">§2</p><h2 id="exp-title" data-i18n="exp_title"></h2></div>
      </div>
      <p class="lede" data-i18n="exp_lede"></p>
      <form class="exp-form" id="exp-form">
        <label><span data-i18n="steps"></span><select id="e-steps"><option>2</option><option>4</option><option>8</option></select></label>
        <label><span>seed</span><input id="e-seed" inputmode="numeric" value="1729" maxlength="10"></label>
        <label><span data-i18n="samples"></span><select id="e-n"><option>1000</option><option selected>10000</option><option>20000</option></select></label>
        <button class="primary" id="e-run" type="submit" data-i18n="run"></button>
        <button id="e-cancel" type="button" data-i18n="cancel" disabled></button>
        <button id="e-csv" type="button" data-i18n="csv"></button>
        <button id="e-share" type="button" data-i18n="share"></button>
      </form>
      <p class="meta mono" id="e-meta" aria-live="polite"></p>
      <div class="hists" id="hists"></div>
      <p class="summary" id="e-summary"></p>
      <div class="inspect" id="inspect" hidden></div>
      <div class="table-wrap"><table id="e-table"></table></div>
      <details open><summary data-i18n="rules"></summary>
        <ul class="rules">
          <li data-i18n-html="rule_uniform"></li>
          <li data-i18n-html="rule_distinct"></li>
          <li data-i18n-html="rule_radius"></li>
          <li data-i18n-html="rule_seed"></li>
        </ul>
        <p data-i18n="why_further"></p>
        <p class="mono repro" id="e-repro"></p>
      </details>
    </section>

    <div class="workspace" id="simulator">
      <section class="stage" aria-labelledby="cube-label">
        <div class="stage-top"><h2 id="cube-label" data-i18n="cube"></h2><output id="status" aria-live="polite"></output></div>
        <a class="backlink" id="backlink" href="#experiment" hidden></a>
        <canvas id="cube" width="640" height="520" role="img"></canvas>
        <dl class="facts mono" id="facts"></dl>
        <div class="stage-bottom"><span id="last">—</span><button id="view" type="button"></button></div>
      </section>
      <section class="controls" aria-labelledby="play-label">
        <h2 id="play-label" data-i18n="play"></h2>
        <div class="row setup"><label for="length" data-i18n="scramble_len"></label><select id="length"><option value="4">4</option><option value="8" selected>8</option><option value="16">16</option></select></div>
        <div class="row"><button class="primary" id="scramble" type="button" data-i18n="scramble"></button><button id="reset" type="button" data-i18n="reset"></button><button id="csolve" type="button" title="optimal solver, written in C, compiled to WebAssembly (≤ 8 moves)">⚡ optimal · C</button></div>
        <div id="moves" role="group"></div>
        <p class="hint" data-i18n-html="hint"></p>
        <div class="guide"><h2 data-i18n="history_title"></h2><p class="hint" data-i18n="history_note"></p><p id="instruction" aria-live="polite"></p>
          <div class="row"><button class="primary" id="step" type="button" data-i18n="next_step"></button><button id="auto" type="button"></button></div>
          <ol id="solution"></ol>
        </div>
      </section>
    </div>
    <details class="net"><summary data-i18n="net"></summary><div id="net"></div></details>

    <section id="boom" aria-labelledby="tree-label">
      <div class="tree-heading"><div><p class="eyebrow">§3</p><h2 id="tree-label" data-i18n="tree"></h2><p data-i18n="tree_body"></p></div><button id="replay" type="button" data-i18n="animate"></button></div>
      <nav id="trail"></nav>
      <div class="tree-root" id="root"></div>
      <div class="tree-branches" id="branches"></div>
      <div class="row tree-actions"><button id="back" type="button" data-i18n="back"></button><button class="primary" id="load" type="button" data-i18n="load"></button></div>
      <div class="graph" id="graph"></div>
      <details><summary data-i18n="as_list"></summary><ol id="permutations"></ol></details>
    </section>
    <footer><a href="https://www.instagram.com/reel/DeBrTWChFxy/" data-i18n="credit"></a><span class="mono" id="version"></span></footer>
  </main>
<script type="module" src="/the6cube/coffee.js"></script>
</body>
</html>

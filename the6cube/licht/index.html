<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0a12">
<title>Wintercircus · Cube · Corvus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE  mysterious, nocturnal, a mathematician's séance — Corvus at night
   IDEA   a long-exposure photograph of a cube being solved; below it, the tree of every choice
   PICTURE light-painted solve show (cube + permutation wheel), then a living tree with fruit-states and the crow
   COLOUR  Corvus ink #0d0a12, violet #5b3e8c / #7a5cb0, lantern gold #ffd76a; stickers switch classic/spectrum/neon
   TYPE    Bodoni Moda for voice, Instrument Sans for reading, mono for move notation */
:root{
  --bg:#0d0a12; --bg2:#120d1a; --deep:#1d1430; --plum:#2c1f45; --violet:#5b3e8c; --lilac:#7a5cb0; --lav:#b4a0d6;
  --gold:#ffd76a; --cream:#efe7d2; --fg:rgba(239,231,210,.9); --mute:rgba(239,231,210,.58); --faint:rgba(239,231,210,.16);
  --serif:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif; --sans:'Instrument Sans',ui-sans-serif,system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;min-width:0}
html{background:var(--bg);color:var(--fg);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{margin:0;overflow-x:clip;background:var(--bg)}
a{color:var(--lav)}
button{font:inherit;color:inherit}
.wrap{width:min(1240px,100% - 40px);margin:0 auto}

header.site{position:sticky;top:0;z-index:20;backdrop-filter:blur(12px);background:rgba(13,10,18,.62);border-bottom:1px solid rgba(91,62,140,.25)}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--cream)}
.brand img{width:34px;height:34px;border-radius:50%}
.brand span{font-family:var(--serif);letter-spacing:.42em;font-size:15px}

h1,h2{font-family:var(--serif);font-weight:400;color:var(--cream);margin:0;text-wrap:balance}
h1{font-size:clamp(38px,5vw,68px);line-height:1.02}
h2{font-size:clamp(32px,4vw,52px);line-height:1.05}
em.g{font-style:italic;color:var(--gold);font-weight:500}
p.lead{color:var(--mute);font-size:clamp(16px,1.3vw,17.5px);max-width:48ch}
.chnum{font-family:var(--serif);font-style:italic;color:var(--lilac);font-size:20px;margin-bottom:8px}

/* ---------- the show ---------- */
.show{position:relative;height:calc(100svh - 60px);min-height:640px;overflow:hidden;background:radial-gradient(900px 600px at 62% 45%,rgba(91,62,140,.28),transparent 65%),var(--bg)}
.show canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.show canvas:active{cursor:grabbing}
.show{display:flex;flex-direction:column;justify-content:space-between;gap:28px;height:auto!important;min-height:calc(100svh - 60px);padding:54px max(calc(clamp(48px,7vw,120px) + 24px),calc((100% - 1240px)/2)) 22px}
.show .copy{position:relative;z-index:2;width:min(440px,90%);pointer-events:none}
.show .copy p{pointer-events:auto}
.show .copy h1,.show .copy p{text-shadow:0 2px 14px rgba(6,5,9,.95),0 0 2px rgba(6,5,9,.9)}
.marquee{display:inline-block;font:12px var(--mono);letter-spacing:.34em;text-transform:uppercase;color:var(--gold);padding:8px 16px;margin:0 0 18px;border-radius:999px;position:relative}
.marquee::before{content:"";position:absolute;inset:0;border-radius:999px;padding:2px;background:radial-gradient(circle,var(--gold) 1.3px,transparent 1.8px) 0 0/12px 12px;-webkit-mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:bulbs 1.4s steps(2) infinite}
@keyframes bulbs{50%{background-position:6px 0}}
.dock{position:relative;z-index:2;width:min(450px,100%);display:flex;flex-direction:column;gap:10px;pointer-events:none}
/* the circus: velvet curtains drawn back at both sides, a scalloped valance, gold rope and fringe */
.curtain{position:absolute;top:0;bottom:0;width:clamp(48px,7vw,120px);z-index:1;pointer-events:none;background:repeating-linear-gradient(90deg,#3d0a16 0,#7a1428 9px,#a51d36 15px,#7a1428 21px,#3d0a16 30px);box-shadow:inset 0 -40px 60px rgba(0,0,0,.55),0 0 50px rgba(0,0,0,.7)}
.curtain.l{left:0;clip-path:polygon(0 0,100% 0,62% 52%,100% 100%,0 100%);transform-origin:left}
.curtain.r{right:0;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,38% 52%)}
.curtain::after{content:"";position:absolute;top:50%;width:80%;height:7px;border-radius:4px;background:linear-gradient(90deg,#c9a54a,#ffd76a,#c9a54a);box-shadow:0 0 10px rgba(255,215,106,.5)}
.curtain.l::after{left:4%}.curtain.r::after{right:4%}
.valance{position:absolute;left:0;right:0;top:0;height:34px;z-index:1;pointer-events:none;background:radial-gradient(circle at 50% -14px,#a51d36 26px,#7a1428 27px 30px,transparent 31px) 0 0/64px 34px repeat-x;filter:drop-shadow(0 6px 8px rgba(0,0,0,.6))}
.valance::after{content:"";position:absolute;left:0;right:0;top:30px;height:5px;background:radial-gradient(circle,#ffd76a 1.4px,transparent 1.8px) 0 0/8px 5px repeat-x;opacity:.8}
@media(max-width:720px){.curtain{width:22px}.valance{height:22px;background-size:40px 22px}}
.dock>*{pointer-events:auto}
.panel{background:rgba(18,13,26,.72);backdrop-filter:blur(14px);border:1px solid rgba(91,62,140,.4);border-radius:18px;padding:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid rgba(122,92,176,.55);background:rgba(44,31,69,.5);padding:11px 18px;border-radius:999px;cursor:pointer;font-size:14px;min-height:44px;transition:.2s}
.btn:hover{border-color:var(--lav);background:rgba(91,62,140,.5)}
.btn.primary{background:var(--gold);color:#1a1206;border-color:var(--gold);font-weight:600}
.btn.big{font-size:16px;padding:13px 26px}
.btn:disabled{opacity:.4;cursor:default}
.seg{display:flex;border:1px solid rgba(122,92,176,.45);border-radius:999px;padding:3px}
.seg button{background:none;border:0;border-radius:999px;padding:8px 12px;font-size:12.5px;color:var(--mute);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--violet);color:var(--cream)}
.pad{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.pad button{font-family:var(--mono);font-size:13px;height:34px;border-radius:8px;border:1px solid rgba(122,92,176,.28);background:rgba(13,10,18,.7);cursor:pointer;color:var(--cream);border-bottom:2px solid var(--c)}
.pad button:hover{border-color:var(--lav)}
.meter{font-family:var(--mono);font-size:12px;color:var(--mute);display:flex;gap:16px;align-items:center;margin-top:10px}
.meter b{color:var(--cream);font-weight:500}
.bar{flex:1;height:4px;border-radius:4px;background:rgba(122,92,176,.25);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--lilac),var(--gold));transition:width .3s}
details.moves{width:100%}
details.moves summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:4px 6px}
details.moves summary::-webkit-details-marker{display:none}
details.moves summary::after{content:"▴";color:var(--lav)}
details.moves[open] summary::after{content:"▾"}
details.moves ol{margin:8px 0 0;padding:0;list-style:none;max-height:min(260px,34svh);overflow:auto;counter-reset:m}
details.moves li{counter-increment:m;display:grid;grid-template-columns:26px 40px 1fr;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;font-size:13px;color:var(--mute);cursor:pointer}
details.moves li::before{content:counter(m);font-family:var(--mono);font-size:11px;color:rgba(239,231,210,.3)}
details.moves li code{font-family:var(--mono);color:var(--cream);font-size:14px;border-bottom:2px solid var(--c);width:max-content}
details.moves li.done{opacity:.32}
details.moves li.cur{background:rgba(255,215,106,.1);color:var(--cream)}
details.moves .empty{color:var(--mute);font-size:13px;margin:8px 6px 4px}
.hint{font-size:12px;color:var(--mute);margin:8px 2px 0}
.hint kbd{font-family:var(--mono);color:var(--cream);border:1px solid var(--faint);border-radius:4px;padding:0 4px;font-size:11px}
.toast{position:absolute;left:64%;top:14%;transform:translate(-50%,-50%) scale(.96);font-family:var(--serif);font-size:clamp(30px,5vw,64px);color:var(--gold);font-style:italic;opacity:0;pointer-events:none;transition:opacity .6s,transform .9s;text-align:center;text-shadow:0 0 40px rgba(255,215,106,.5)}
.toast small{display:block;font-family:var(--mono);font-style:normal;font-size:13px;color:var(--cream);letter-spacing:.1em;margin-top:8px}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* ---------- the tree ---------- */
section.treesec{position:relative;padding:90px 0 40px;background:linear-gradient(180deg,var(--bg),#100a1a 40%,#0b0810)}
.treehead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.treefig{position:relative;height:min(860px,92svh);min-height:560px;margin-top:10px}
.treefig canvas{position:absolute;inset:0;width:100%;height:100%}
.tip{position:absolute;pointer-events:none;background:rgba(29,20,48,.92);border:1px solid var(--lilac);border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--cream);opacity:0;transition:opacity .15s;max-width:240px;z-index:3}
.tip code{font-family:var(--mono);color:var(--gold)}
.selbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--mute);margin-top:6px}
.selbar code{font-family:var(--mono);color:var(--gold);font-size:16px}
.tstats{font-family:var(--mono);font-size:12px;color:var(--mute);display:grid;grid-template-columns:repeat(4,auto);justify-content:start;gap:3px 30px;margin-top:28px}
.tstats b{color:var(--cream);font-weight:500}.tstats .d{color:var(--gold)}

/* ---------- chapters ---------- */
section.ch{padding:110px 0;position:relative;border-top:1px solid rgba(91,62,140,.18)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center}
.mini{position:relative;aspect-ratio:1/1;width:100%;max-width:520px;justify-self:center}
.mini canvas{position:absolute;inset:0;width:100%;height:100%}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}
.chip{font-family:var(--mono);font-size:13px;padding:8px 12px;border-radius:999px;border:1px solid rgba(122,92,176,.4);background:transparent;cursor:pointer;color:var(--cream);min-height:36px}
.chip[aria-pressed=true]{background:var(--violet);border-color:var(--lilac)}
.orderline{display:flex;align-items:baseline;gap:14px;margin:8px 0 18px;flex-wrap:wrap}
.big{font-family:var(--serif);font-size:clamp(56px,8vw,104px);line-height:1;color:var(--gold)}
.cycles{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:hidden;mask-image:linear-gradient(#000 75%,transparent)}
.cyc{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11px;color:var(--mute)}
.cyc i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c);display:inline-block}
.cyc span{margin-left:8px}
.factors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:34px 0}
.factor{border:1px solid rgba(91,62,140,.35);border-radius:16px;padding:18px;background:linear-gradient(180deg,rgba(44,31,69,.35),rgba(18,13,26,.2))}
.factor .f{font-family:var(--serif);font-size:30px;color:var(--gold)}
.factor .v{font-family:var(--mono);font-size:12px;color:var(--lav)}
.factor p{font-size:13.5px;color:var(--mute);margin:8px 0 0}
.counter{font-family:var(--mono);font-size:clamp(20px,3.6vw,44px);color:var(--cream);word-break:break-all}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:34px}
.facts div{border-left:1px solid var(--violet);padding-left:16px;color:var(--mute);font-size:14.5px}
.facts b{display:block;color:var(--cream);font-family:var(--serif);font-weight:400;font-size:24px}
#god{overflow:hidden}
#halftone{position:absolute;inset:0;width:100%;height:100%;opacity:.85;pointer-events:none;mask-image:linear-gradient(90deg,transparent,#000 55%)}
#god .wrap{position:relative}
.bars{display:flex;align-items:flex-end;gap:4px;height:300px;margin-top:20px}
.gbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative}
.gbar i{display:block;width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--lilac),rgba(91,62,140,.25));height:0;transition:height 1.2s cubic-bezier(.2,.7,.2,1)}
.gbar.twenty i{background:linear-gradient(180deg,var(--gold),rgba(255,215,106,.2))}
.gbar.you i{box-shadow:0 0 0 2px var(--gold),0 0 22px rgba(255,215,106,.5)}
.gbar span{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-top:6px}
.gbar .t{position:absolute;bottom:calc(100% + 6px);font-family:var(--mono);font-size:11px;color:var(--cream);background:var(--plum);padding:4px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;z-index:2}
.gbar:hover .t{opacity:1}
.youtag{font-family:var(--mono);font-size:12px;color:var(--gold);margin-top:14px;min-height:1.4em}

footer{padding:70px 0 60px;border-top:1px solid rgba(91,62,140,.18);color:var(--mute);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
footer img{width:72px;image-rendering:pixelated}
footer .sig{display:flex;align-items:center;gap:14px}
footer .sig em{font-family:var(--serif);color:var(--cream);font-size:18px}

@media (max-width:900px){
  .show{height:auto;min-height:0;display:flex;flex-direction:column}
  .show .copy{position:relative;left:auto;top:auto;width:auto;padding:26px 20px 0;order:-1}
  .toast{left:50%;top:30%}
  .show canvas{position:relative;height:62svh;min-height:380px}
  .dock{position:relative;left:auto;transform:none;bottom:auto;width:auto;margin:0 16px 22px;flex-direction:column;align-items:stretch}
  details.moves{width:100%}
  .pad{grid-template-columns:repeat(6,minmax(0,1fr))}
  .split{grid-template-columns:minmax(0,1fr);gap:20px}
  .factors{grid-template-columns:repeat(2,minmax(0,1fr))}
  .facts{grid-template-columns:minmax(0,1fr)}
  section.ch{padding:72px 0}
  .bars{height:220px;gap:2px}.gbar span{font-size:9px}
  .brand span{display:none}
  .treefig{height:78svh;min-height:520px}
  .tstats{gap:3px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="/"><img src="/the6cube/assets/day-1.svg" alt="Corvus"><span>CORVUS</span></a><a href="/the6cube/" style="font:12px ui-monospace,monospace;color:#b4a0d6;text-decoration:none">← 🏛️ portal</a>
  </div>
</header>

<main>
  <section class="show" id="show">
    <canvas id="hero" aria-label="Rubik's cube"></canvas>
    <div class="valance" aria-hidden="true"></div><div class="curtain l" aria-hidden="true"></div><div class="curtain r" aria-hidden="true"></div>
    <div class="copy">
      <p class="marquee">Wintercircus · Gent</p>
      <h1 data-i18n-html="show_title"></h1>
      <p class="lead" data-i18n="show_lead"></p>
    </div>
    <div class="toast" id="toast"></div>
    <div class="dock">
      <div class="panel">
        <div class="acts">
          <button class="btn" id="scramble" data-i18n="scramble"></button>
          <button class="btn primary big" id="solve" data-i18n="solve"></button>
          <button class="btn" id="reset" data-i18n="reset"></button>
          <div class="seg" id="palette" role="group"></div>
        </div>
        <div class="meter"><span><span data-i18n="home"></span> <b id="home">54/54</b></span><div class="bar"><i id="homebar"></i></div><span><span data-i18n="depth"></span> <b id="depthv">0</b></span></div>
      </div>
      <div class="panel">
        <div class="pad" id="pad"></div>
        <p class="hint" data-i18n-html="hint"></p>
      </div>
      <details class="moves panel" id="movesbox">
        <summary><span id="movesum"></span></summary>
        <ol id="movelist"></ol>
        <p class="empty" id="moveempty" data-i18n="solved_empty"></p>
      </details>
    </div>
  </section>

  <section class="treesec" id="tree">
    <div class="wrap">
      <div class="treehead">
        <div>
          <h2 data-i18n-html="c4_title"></h2>
          <p class="lead" data-i18n="tree_lead"></p>
        </div>
        <button class="btn" id="treefrom" data-i18n="tree_from"></button>
      </div>
    </div>
    <div class="treefig" id="treefig"><canvas id="treecv" aria-label="Beslisboom"></canvas><div class="tip" id="tip"></div></div>
    <div class="wrap">
      <div class="selbar"><span data-i18n="path"></span> <code id="selpath">·</code><button class="btn primary" id="loadsel" data-i18n="load_solve"></button></div>
      <div class="tstats" id="treestats"></div>
    </div>
  </section>

  <section class="ch" id="perm">
    <div class="wrap split">
      <div>
        <div class="chnum">I.</div>
        <h2 data-i18n-html="c1_title"></h2>
        <p class="lead" data-i18n="c1_body"></p>
        <div class="chips" id="seqchips"></div>
        <div class="orderline"><span class="big" id="order">4</span><span class="lead" id="ordertext" style="margin:0"></span></div>
        <div class="cycles" id="cycles"></div>
      </div>
      <div class="mini"><canvas id="permcv"></canvas></div>
    </div>
  </section>

  <section class="ch" id="count">
    <div class="wrap" id="countbox">
      <div class="chnum">II.</div>
      <h2 data-i18n-html="c2_title"></h2>
      <p class="lead" data-i18n="c2_body"></p>
      <div class="factors">
        <div class="factor"><div class="f">8!</div><div class="v">40 320</div><p data-i18n="f1"></p></div>
        <div class="factor"><div class="f">3<sup>7</sup></div><div class="v">2 187</div><p data-i18n="f2"></p></div>
        <div class="factor"><div class="f">12! / 2</div><div class="v">239 500 800</div><p data-i18n="f3"></p></div>
        <div class="factor"><div class="f">2<sup>11</sup></div><div class="v">2 048</div><p data-i18n="f4"></p></div>
      </div>
      <div class="counter" id="counter">0</div>
      <div class="facts">
        <div><b data-i18n="fa1"></b><span data-i18n="fa1b"></span></div>
        <div><b data-i18n="fa2"></b><span data-i18n="fa2b"></span></div>
        <div><b data-i18n="fa3"></b><span data-i18n="fa3b"></span></div>
      </div>
    </div>
  </section>

  <section class="ch" id="god">
    <canvas id="halftone" aria-hidden="true"></canvas>
    <div class="wrap" id="godbox">
      <div class="chnum">III.</div>
      <h2 data-i18n-html="c3_title"></h2>
      <p class="lead" data-i18n="c3_body"></p>
      <div class="chips" id="scalechips"><button class="chip" data-s="log" aria-pressed="true">log₁₀</button><button class="chip" data-s="lin" aria-pressed="false" data-i18n="linear"></button></div>
      <div class="bars" id="bars" role="img"></div>
      <div class="youtag" id="youtag"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="sig"><img src="/the6cube/assets/wing-flight.webp" alt="" style="cursor:pointer" onclick="window.cubeCoffee?.open('crow')"><div><em data-i18n="sign"></em><br><span>corvus.gent</span></div></div>
    <span data-i18n-html="credit"></span>
  </div>
</footer>

<script>
{
'use strict';
const LANGS=[['nl','NL'],['en','EN'],['fr','FR'],['de','DE'],['es','ES'],['pt','PT'],['zh','中文'],['hi','हिं'],['ta','த']];
const T={
nl:{eyebrow:'Eén kubus · 54 stickers',title:'Elke draai is een <em class="g">permutatie.</em>',lead:'Achter een speelgoedkubus zit een van de mooiste structuren uit de wiskunde. Scramble hem, draai zelf, of laat hem de weg terug vinden.',

function visibleKids(n){if(!n.open)return[];const k=kids(n);if(n.showAll)return k;const N=showN(),step=k.length/N;let v=Array.from({length:N},(_,i)=>k[Math.floor(i*step+step/2)]);for(let x=selected;x;x=x.parent)if(x.parent===n&&!v.includes(x))v.push(x);return v}
function seedTree(st){rootNode=mkNode(st,[],null);rootNode.open=true;rootNode.grow=1;const v=visibleKids(rootNode);
  (narrowTree()?[v[1]]:[v[1],v[3]]).forEach(c=>{if(c){c.open=true;const g=visibleKids(c);if(g[2]){g[2].open=true}}});selected=rootNode;updateSel()}
const fireflies=Array.from({length:46},()=>({x:Math.random(),y:Math.random(),p:Math.random()*6.28,s:.3+Math.random()*.7,gold:Math.random()<.3}));
function layout(W,H){const out=[];const nw=W<640;
  function place(n,x,y,ang,span,depth){n.x=x;n.y=y;n.depth=depth;out.push(n);const v=visibleKids(n);const hidden=n.open&&!n.showAll&&kids(n).length>v.length;const k=v.length+(hidden?1:0);
    const len=H*(nw?.2:.25)*Math.pow(.86,depth);
    v.forEach((c,i)=>{const a=ang-span/2+span*(i+.5)/k;place(c,x+Math.sin(a)*len,y-Math.cos(a)*len,a*.9,Math.max(nw?.8:1.05,span*(nw?.7:.82)),depth+1)});
    n.bud=hidden?{a:ang-span/2+span*(k-.5)/k,len:len*.55,count:kids(n).length-v.length}:null}
  place(rootNode,0,0,0,nw?2.1:2.5,0);
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;out.forEach(n=>{x0=Math.min(x0,n.x);x1=Math.max(x1,n.x);y0=Math.min(y0,n.y);y1=Math.max(y1,n.y)});
  const pad=70,sc=Math.min(1.15,(W-pad*2)/Math.max(1,x1-x0),(H-pad-150)/Math.max(1,y1-y0));
  return{nodes:out,sc,ox:W/2-(x0+x1)/2*sc,oy:H-120-y1*sc}}
let TL=null;
function drawTree(ts,dt){
  const[d]=fitCanvas(treeCv);const W=treeCv.width,H=treeCv.height,g=tctx;g.clearRect(0,0,W,H);
  // ground: halftone dots fading up
  g.save();const step=9*d;for(let y=H-110*d;y<H;y+=step)for(let x=(y/step%2)*step/2;x<W;x+=step){const k=(y-(H-110*d))/(110*d);g.fillStyle=`rgba(122,92,176,${.05+.25*k})`;g.beginPath();g.arc(x,y,1+1.6*k*d,0,7);g.fill()}g.restore();
  // fireflies
  g.save();g.globalCompositeOperation='lighter';fireflies.forEach(f=>{f.p+=dt*.0006*f.s;const x=(f.x+Math.sin(f.p)*.03)*W,y=(f.y+Math.cos(f.p*.7)*.04)*H*.85;g.globalAlpha=.25+.35*Math.sin(f.p*3)**2;const sz=7*d*f.s;g.drawImage(sprite(f.gold?'#ffd76a':'#b4a0d6'),x-sz,y-sz,sz*2,sz*2)});g.restore();
  const L=layout(W/d,H/d);TL=L;const S=(x,y)=>[(L.ox+x*L.sc)*d,(L.oy+y*L.sc)*d];
  const onPath=new Set();for(let x=selected;x;x=x.parent)onPath.add(x);
  const sway=n=>Math.sin(ts*.0008+n.depth*1.3+(n.x||0)*.01)*n.depth*1.4;
  hits=[];
  // branches
  L.nodes.forEach(n=>{n.grow=Math.min(1,n.grow+dt*.0022);if(!n.parent)return;const pr=n.parent;const[ax,ay]=S(pr.x+sway(pr),pr.y),[bx0,by0]=S(n.x+sway(n),n.y);const gk=ease(n.grow);const bx=ax+(bx0-ax)*gk,by=ay+(by0-ay)*gk;
    const mx=(ax+bx)/2+(by-ay)*.12,my=(ay+by)/2-(bx-ax)*.12;const w=Math.max(1.3,12*Math.pow(.62,n.depth))*d*L.sc;const mvc=COLORS[n.path[n.path.length-1][0]];
    const gr=g.createLinearGradient(ax,ay,bx,by);gr.addColorStop(0,onPath.has(n)?'#ffd76a':'#3d2b5e');gr.addColorStop(1,onPath.has(n)?'#ffd76a':mvc);
    g.save();g.strokeStyle=gr;g.lineWidth=w;g.lineCap='round';g.globalAlpha=onPath.has(n)?1:.75;if(onPath.has(n)){g.shadowColor='rgba(255,215,106,.8)';g.shadowBlur=14*d}
    g.beginPath();g.moveTo(ax,ay);g.quadraticCurveTo(mx,my,bx,by);g.stroke();g.restore()});
  // trunk into the ground
  {const[rx,ry]=S(rootNode.x,rootNode.y);g.save();const gr=g.createLinearGradient(rx,ry,rx,H);gr.addColorStop(0,'#5b3e8c');gr.addColorStop(1,'rgba(91,62,140,0)');g.strokeStyle=gr;g.lineWidth=16*d*L.sc;g.lineCap='round';g.beginPath();g.moveTo(rx,ry);g.quadraticCurveTo(rx-10*d,(ry+H)/2,rx,H);g.stroke();g.restore()}
  // buds
  L.nodes.forEach(n=>{if(!n.bud||n.grow<.9)return;const[ax,ay]=S(n.x+sway(n),n.y);const bx=ax+Math.sin(n.bud.a)*n.bud.len*L.sc*d,by=ay-Math.cos(n.bud.a)*n.bud.len*L.sc*d;
    g.save();g.setLineDash([3*d,4*d]);g.strokeStyle='rgba(180,160,214,.6)';g.lineWidth=1.5*d;g.beginPath();g.moveTo(ax,ay);g.lineTo(bx,by);g.stroke();g.setLineDash([]);
    const rr=(13+Math.sin(ts*.004)*1.5)*d;g.fillStyle='rgba(29,20,48,.95)';g.strokeStyle='#b4a0d6';g.beginPath();g.arc(bx,by,rr,0,7);g.fill();g.stroke();g.fillStyle='#efe7d2';g.font=`${11*d}px ui-monospace,monospace`;g.textAlign='center';g.textBaseline='middle';g.fillText('+'+n.bud.count,bx,by);g.restore();
    hits.push({type:'bud',n,x:bx/d,y:by/d,r:rr/d+4})});
  // fruit (states)
  L.nodes.forEach(n=>{if(n.grow<.85)return;const[x,y]=S(n.x+sway(n),n.y);const rr=Math.max(narrowTree()?13:16,(n.parent?34:52)*Math.pow(.86,n.depth)*Math.min(1.1,L.sc+.25))*d;const breathe=1+Math.sin(ts*.002+n.depth+(n.x||0))*.04;
    g.save();const glow=g.createRadialGradient(x,y,rr*.4,x,y,rr*1.8);glow.addColorStop(0,onPath.has(n)?'rgba(255,215,106,.22)':'rgba(122,92,176,.2)');glow.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=glow;g.beginPath();g.arc(x,y,rr*1.8,0,7);g.fill();
    g.fillStyle='rgba(13,10,18,.92)';g.strokeStyle=n===selected?'#ffd76a':onPath.has(n)?'rgba(255,215,106,.6)':'rgba(122,92,176,.55)';g.lineWidth=(n===selected?2.2:1.2)*d;g.beginPath();g.arc(x,y,rr*breathe,0,7);g.fill();g.stroke();g.restore();
    let an=null;if(n===hoverNode&&n.parent){n.hoverT=Math.min(1,n.hoverT+dt/560);an={move:n.path[n.path.length-1],p:n.hoverT}}else n.hoverT=0;
    g.save();g.beginPath();g.arc(x,y,rr*breathe-1,0,7);g.clip();drawCube(g,an&&an.p<1?n.parent.state:n.state,{yaw:-.62+Math.sin(ts*.0004+n.depth)*.25,pitch:.5,zoom:1.05},an&&an.p<1?an:null,{cx:x,cy:y,size:rr*1.75,dpr:d,rings:false,orbits:false,dot:.24,glow:.8,trail:1.4});g.restore();
    g.save();g.font=`${(n.parent?12:13)*d}px ui-monospace,monospace`;g.textAlign='center';g.fillStyle=onPath.has(n)?'#ffd76a':'#efe7d2';g.fillText(n.parent?pm(n.path[n.path.length-1]):(treeRootPath.length?t('tree_from').split(' ')[0]+' ⟲':t('solved')),x,y+rr+14*d);g.restore();
    hits.push({type:'node',n,x:x/d,y:y/d,r:rr/d})});
  // the crow perches on the selected fruit
  if(selected&&crow.complete&&selected.grow>.85){const[x,y]=S(selected.x+sway(selected),selected.y);const rr=Math.max(16,(selected.parent?34:52)*Math.pow(.86,selected.depth)*Math.min(1.1,L.sc+.25))*d;const cs=58*d;g.save();g.imageSmoothingEnabled=false;g.drawImage(crow,x-cs*.48,y-rr-cs*.78+Math.sin(ts*.003)*2*d,cs,cs);g.restore()}
}
function pickTree(e){const r=treeCv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let best=null;for(const h of hits){const dd=Math.hypot(h.x-x,h.y-y);if(dd<h.r&&(!best||dd<best.d))best={...h,d:dd}}return[best,x,y]}
treeCv.addEventListener('pointermove',e=>{const[h,x,y]=pickTree(e);treeCv.style.cursor=h?'pointer':'default';hoverNode=h&&h.type==='node'?h.n:null;
  if(h&&h.type==='node'){tip.style.opacity=1;tip.style.left=Math.min(x+14,treeCv.clientWidth-200)+'px';tip.style.top=(y+14)+'px';tip.innerHTML=`<code>${h.n.path.length?h.n.path.map(pm).join(' '):'·'}</code><br>${t('home')} ${homeCount(h.n.state)}/54 · ${t('st_depth')} ${h.n.path.length}`}else tip.style.opacity=0});
treeCv.addEventListener('pointerleave',()=>{tip.style.opacity=0;hoverNode=null});
treeCv.addEventListener('click',e=>{const[h]=pickTree(e);if(!h)return;if(h.type==='bud'){h.n.showAll=true;return}
  const n=h.n;if(selected===n&&n.open){n.open=false}else{n.open=true;visibleKids(n).forEach(c=>{if(c.grow>=1)return})}selected=n;updateSel()});
function updateSel(){document.getElementById('selpath').textContent=selected&&selected.path.length?selected.path.map(pm).join(' '):'·'}
document.getElementById('treefrom').onclick=()=>{treeRootPath=[...path];seedTree(state)};
document.getElementById('loadsel').onclick=()=>{if(!selected)return;const st=selected.state,p=[...treeRootPath,...selected.path].reduce(pushMove,[]);reset();state=st;path=p;refreshUI();document.getElementById('show').scrollIntoView({behavior:'smooth'});setTimeout(()=>solve(),900)};
function treeStats(){let a=9,b=9;const rows=[[t('st_depth'),t('st_naive'),t('st_pruned'),t('st_true')]];for(let d=1;d<=5;d++){rows.push([d,(18**d).toLocaleString(lang),(a+b).toLocaleString(lang),DIST[d].toLocaleString(lang)]);[a,b]=[6*a+6*b,9*a+6*b]}
  document.getElementById('treestats').innerHTML=rows.map((r,i)=>r.map((c,j)=>i===0?`<span>${c}</span>`:`<b class="${j===3&&i>=4?'d':''}">${c}</b>`).join('')).join('')}

/* ================= chapter I ================= */
const PRESETS=[['R'],['R','U'],['R','U',"R'","U'"],['R','U2',"D'",'B',"D'"],['F','R',"U'","R'","U'",'R','U',"R'","F'"]];
let seqSel=1;const permCv=document.getElementById('permcv'),pctx=permCv.getContext('2d');const pcam={yaw:.55,pitch:.42,zoom:.92};let pstate=SOLVED,pstep=0,panim=null;
const chips=document.getElementById('seqchips');
PRESETS.forEach((s,i)=>{const b=document.createElement('button');b.className='chip';b.textContent=s.map(pm).join(' ');b.onclick=()=>{seqSel=i;pstate=SOLVED;pstep=0;panim=null;renderOrder()};chips.append(b)});
function renderOrder(){const seq=PRESETS[seqSel];chips.querySelectorAll('.chip').forEach((b,i)=>b.setAttribute('aria-pressed',i===seqSel));
  const cyc=cyclesOf(permOf(seq));const ord=cyc.reduce((a,c)=>lcm(a,c.length),1);document.getElementById('order').textContent=ord.toLocaleString(lang);
  const lens={};cyc.forEach(c=>lens[c.length]=(lens[c.length]||0)+1);
  document.getElementById('ordertext').textContent=t('order_t',{c:Object.entries(lens).sort((a,b)=>a[0]-b[0]).map(([l,n])=>n+'×'+l).join(' · ')});
  const box=document.getElementById('cycles');box.innerHTML='';cyc.sort((a,b)=>b.length-a.length).slice(0,9).forEach(c=>{const d=document.createElement('div');d.className='cyc';d.innerHTML=c.map(i=>`<i style="--c:${colorOf(SOLVED[i])}"></i>`).join('')+`<span>${c.length}</span>`;box.append(d)})}

/* ================= chapter II ================= */
const TOTAL=43252003274489856000n;let counted=false;
function runCounter(){if(counted)return;counted=true;const el=document.getElementById('counter');const t0=now(),D=2600;const fmt=n=>n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  (function step(ts){const k=Math.min(1,(ts-t0)/D),e=1-Math.pow(1-k,4);const big=k<1?BigInt(Math.floor(Math.pow(10,e*20*.999)*(.4+Math.random()*.6))):TOTAL;el.textContent=fmt(big<TOTAL?big:TOTAL);if(k<1)requestAnimationFrame(step)})(t0)}

/* ================= chapter III ================= */
const DIST=[1,18,243,3240,43239,574908,7618438,100803036,1332343288,17596479795,232248063316,3063288809012,40374425656248,531653418284628,6989320578825358,91365146187124313,1.1e18,1.2e19,2.9e19,1.5e18,4.9e8];
const barsEl=document.getElementById('bars');let barScale='log';
const fmtE=v=>v<1e6?Math.round(v).toLocaleString(lang):v.toExponential(2).replace('e+',' × 10^');
DIST.forEach((v,d)=>{const b=document.createElement('div');b.className='gbar'+(d===20?' twenty':'');b.innerHTML=`<div class="t">${d}: ${d>=16?'≈ ':''}${fmtE(v)}</div><i></i><span>${d}</span>`;barsEl.append(b)});
const barH=v=>barScale==='log'?Math.log10(v)/Math.log10(2.9e19)*100:v/2.9e19*100;
function growBars(){barsEl.querySelectorAll('i').forEach((i,k)=>setTimeout(()=>i.style.height=Math.max(.6,barH(DIST[k]))+'%',k*45))}
document.querySelectorAll('#scalechips .chip').forEach(b=>b.onclick=()=>{barScale=b.dataset.s;document.querySelectorAll('#scalechips .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));growBars()});
function updateGodMarker(){const n=path.length;barsEl.querySelectorAll('.gbar').forEach((b,d)=>b.classList.toggle('you',n>0&&d===Math.min(20,n)));document.getElementById('youtag').textContent=n?t('you',{n,m:Math.min(20,n)}):''}
function drawHalftone(){const cv=document.getElementById('halftone'),img=new Image();img.src='/the6cube/assets/diogenes.webp';img.onload=()=>{const[d]=fitCanvas(cv),W=cv.width,H=cv.height,g=cv.getContext('2d');
  const s=Math.max(W/img.width,H/img.height),iw=img.width*s,ih=img.height*s,ox=W-iw,oy=(H-ih)/2;const off=document.createElement('canvas');off.width=W;off.height=H;const o=off.getContext('2d');o.drawImage(img,ox,oy,iw,ih);const data=o.getImageData(0,0,W,H).data;
  const step=Math.round(7*d);g.clearRect(0,0,W,H);const lx=ox+iw*.30,ly=oy+ih*.46;
  for(let y=step/2;y<H;y+=step)for(let x=step/2;x<W;x+=step){const i=(Math.floor(y)*W+Math.floor(x))*4;const l=(data[i]+data[i+1]+data[i+2])/765;const r=l*step*.55;if(r<.4)continue;const gold=Math.max(0,1-Math.hypot(x-lx,y-ly)/(iw*.22));
    g.fillStyle=gold>.05?`rgba(255,${190+40*gold|0},106,${.25+.6*gold*l})`:`rgba(122,92,176,${.12+.5*l})`;g.beginPath();g.arc(x,y,r,0,7);g.fill()}}}

/* ================= language ================= */
window.__cubeSetLang=c=>{lang=c;applyLang()};
function applyLang(){document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el=>el.innerHTML=t(el.dataset.i18nHtml));
  renderPal();refreshUI();renderOrder();treeStats();updateSel()}

/* ================= loop ================= */
let lastT=now(),showVisible=true,treeVisible=false,permVisible=false;
function frame(ts){const dt=Math.min(50,ts-lastT);lastT=ts;
  if(!anim&&queue.length){const j=queue.shift();if(j.kind==='end'){showMode='idle'}else anim={...j,t0:ts}}
  let a=null,done=null;if(anim){const k=Math.min(1,(ts-anim.t0)/(anim.dur||(anim.move.endsWith('2')?560:400)));a={move:anim.move,p:k};if(k>=1){done=anim;anim=null}}
  if(showVisible){const[d,changed]=fitCanvas(heroCv);if(changed)hctx.clearRect(0,0,heroCv.width,heroCv.height);
    if(!dragging&&ts-lastInteract>1800)cam.yaw+=dt*(showMode==='solving'?.00045:.00012);
    const pts=drawShow(hctx,heroCv.width,heroCv.height,done?null:a,d,ts);if(done)onMoveDone(done,(pts||[]).map(p=>({...p,mv:done.move&&p.s.position[turnInfo(done.move).axis]===turnInfo(done.move).sign})))}
  else if(done)onMoveDone(done,null);
  if(treeVisible)drawTree(ts,dt);
  if(permVisible){const[d2]=fitCanvas(permCv);pctx.clearRect(0,0,permCv.width,permCv.height);const seq=PRESETS[seqSel];if(!panim)panim={move:seq[pstep%seq.length],t0:ts};
    const k=Math.min(1,Math.max(0,(ts-panim.t0)/520));pcam.yaw+=dt*.00009;drawCube(pctx,pstate,pcam,{move:panim.move,p:k},{cx:permCv.width/2,cy:permCv.height/2,size:Math.min(permCv.width,permCv.height),dpr:d2,ringAlpha:.1});
    if(k>=1){pstate=turn(pstate,panim.move);pstep++;panim=null;if(pstep%seq.length===0&&stateKey(pstate)===SOLVED_KEY)panim={move:seq[0],t0:ts+600}}}
  requestAnimationFrame(frame)}
const io=new IntersectionObserver(es=>es.forEach(e=>{const id=e.target.id;
  if(id==='show')showVisible=e.isIntersecting;else if(id==='treefig')treeVisible=e.isIntersecting;else if(id==='permcv')permVisible=e.isIntersecting;
  else if(e.isIntersecting){if(id==='countbox')runCounter();if(id==='godbox')growBars()}}),{threshold:.05});
['show','treefig','permcv','countbox','godbox'].forEach(id=>io.observe(document.getElementById(id)));

seedTree(SOLVED);applyLang();drawHalftone();
addEventListener('resize',()=>{clearTimeout(drawHalftone.t);drawHalftone.t=setTimeout(drawHalftone,200)});
requestAnimationFrame(frame);
// first impression: a gentle self-scramble so the page opens mid-story
setTimeout(()=>{if(!path.length&&!queue.length)scramble()},1400);
}
</script>

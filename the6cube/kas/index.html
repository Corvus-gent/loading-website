<style>
/* VOICE  a casino at 3 a.m. where the jester owns the table: laughed at, quietly right
   IDEA   the fool's cashbox: we count people, never money; the chips are votes for what he builds next
   PICTURE the Nar in halftone with ringing gold bells, a circus ring of 54 lights around one number
   COLOUR  near-black, Corvus violet felt, lantern gold for bells and the number, one neon rose for the marquee
   TYPE    Bodoni Moda for the number and the line, mono for every small truth */
:root{--bg:#060509;--felt:#1b1230;--line:#2c1f45;--violet:#7a5cb0;--lav:#b4a0d6;--gold:#ffd76a;--cream:#efe7d2;--dim:rgba(239,231,210,.55);--neon:#ff5c9a;--serif:'Bodoni Moda',Didot,Georgia,serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box;min-width:0}
html{background:var(--bg);color:var(--cream);font:15px/1.55 system-ui,sans-serif}
body{margin:0;padding-top:28px;overflow-x:clip}
a{color:inherit}
.wrap{width:min(1180px,100% - 32px);margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0;font:11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
header a{text-decoration:none}
.stage{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:24px;align-items:center;min-height:calc(100svh - 100px)}
.nar{position:relative;aspect-ratio:3/4;width:100%;max-width:520px;justify-self:center}
.nar canvas{position:absolute;inset:0;width:100%;height:100%}
.marquee{display:inline-block;font:12px var(--mono);letter-spacing:.34em;text-transform:uppercase;color:#ffe3ef;text-shadow:0 0 6px var(--neon),0 0 18px rgba(255,92,154,.6);padding:8px 16px;border-radius:999px;position:relative;margin-bottom:22px}
.marquee::before{content:"";position:absolute;inset:0;border-radius:999px;padding:2px;background:radial-gradient(circle,var(--gold) 1.3px,transparent 1.8px) 0 0/12px 12px;-webkit-mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:bulbs 1.4s steps(2) infinite;pointer-events:none}
@keyframes bulbs{50%{background-position:6px 0}}
.count{position:relative;display:grid;place-items:center;aspect-ratio:1/1;width:min(380px,80vw);margin:6px 0 18px}
.count canvas{position:absolute;inset:0;width:100%;height:100%}
.count .n{font:700 clamp(64px,9vw,112px)/1 var(--serif);color:var(--gold);text-shadow:0 0 30px rgba(255,215,106,.25);position:relative}
.count .l{position:absolute;bottom:22%;left:0;right:0;text-align:center;font:italic 400 clamp(15px,1.5vw,18px) var(--serif);color:var(--cream)}
.line{font:italic 400 clamp(22px,2.6vw,32px)/1.25 var(--serif);margin:0 0 22px;text-wrap:balance}
.line em{color:var(--gold);font-style:italic}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:12px 20px;min-height:48px;font:600 15px system-ui,sans-serif;text-decoration:none;border:1px solid var(--violet);color:var(--cream);background:rgba(27,18,48,.7);cursor:pointer}
.btn.gold{background:var(--gold);color:#1a1206;border-color:var(--gold)}
.btn[aria-disabled=true]{opacity:.45;pointer-events:none}
.mock{display:inline-block;font:10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--neon);border:1px solid rgba(255,92,154,.5);border-radius:6px;padding:2px 8px;margin-left:8px;vertical-align:middle}
section{padding:56px 0;border-top:1px solid var(--line)}
h2{font:400 clamp(24px,2.6vw,32px)/1.15 var(--serif);margin:0 0 6px}
.sub{font:12px var(--mono);color:var(--dim);margin:0 0 18px}
.goal{position:relative;height:14px;border-radius:999px;background:rgba(122,92,176,.18);margin:34px 0 54px}
.goal .fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,var(--violet),var(--gold));transition:width 1.2s cubic-bezier(.2,.7,.2,1)}
.goal .ms{position:absolute;top:-6px;width:2px;height:26px;background:var(--line)}
.goal .ms.on{background:var(--gold)}
.goal .ms span{position:absolute;top:30px;left:50%;transform:translateX(-50%);white-space:nowrap;font:11px var(--mono);color:var(--dim);text-align:center}
.goal .ms.on span{color:var(--gold)}
.goal .ms b{display:block;font:500 14px var(--mono);color:var(--cream)}
.felt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:16px;border-radius:20px;background:radial-gradient(ellipse at 50% 0,#24183d,var(--felt) 70%);box-shadow:inset 0 0 0 6px rgba(201,165,74,.08),inset 0 0 0 7px rgba(201,165,74,.25)}
.spot{position:relative;border:1px solid rgba(201,165,74,.45);border-radius:14px;background:rgba(6,5,9,.3);padding:16px 12px;min-height:150px;display:grid;align-content:space-between;gap:10px;text-align:left;color:var(--cream);font:inherit;cursor:pointer}
.spot:hover,.spot:focus-visible{border-color:var(--gold);outline:none}
.spot[aria-pressed=true]{background:rgba(255,215,106,.1);border-color:var(--gold)}
.spot b{font:400 20px/1.15 var(--serif)}
.spot small{font:12px var(--mono);color:var(--dim)}
.spot .chips{display:flex;gap:3px;flex-wrap:wrap;min-height:18px}
.spot .chips i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,var(--gold) 38%,#c9a54a 40% 62%,var(--gold) 64%);border:1px dashed #fff8}
.spot .v{font:12px var(--mono);color:var(--gold)}
.ticker{display:flex;gap:26px;overflow:hidden;white-space:nowrap;font:13px var(--mono);color:var(--dim);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.ticker div{display:flex;gap:26px;flex:none;animation:tick 40s linear infinite}
.ticker span{flex:none}
@keyframes tick{to{transform:translateX(-50%)}}
.wall{display:flex;flex-wrap:wrap;gap:8px 18px;font:italic 400 18px var(--serif);color:var(--cream)}
.wall span{opacity:.85}
.story p{font:italic 400 clamp(18px,1.9vw,22px)/1.5 var(--serif);max-width:52ch;margin:0 0 16px}
.story p em{color:var(--gold)}
.where{list-style:none;padding:0;margin:0;display:grid;gap:6px;font:13px var(--mono);color:var(--dim)}
.where b{color:var(--cream);font-weight:500}
.legal{font:11.5px/1.6 var(--mono);color:var(--dim);max-width:90ch}
footer{padding:30px 0 50px;font:12px var(--mono);color:var(--dim);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media(max-width:860px){.stage{grid-template-columns:minmax(0,1fr);min-height:0;padding-top:10px}.nar{max-width:300px;order:2}.felt{grid-template-columns:repeat(2,minmax(0,1fr))}.goal .ms span{font-size:9.5px}.goal .ms b{font-size:12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);

/* ---------------- data: count people only ---------------- */
const feed = window.CUBE_DONATIONS_FEED;
let data = null;
async function load() {
  try {
    const r = await fetch(feed, { headers: { accept: 'application/json' } });
    if (!r.ok) throw 0;
    const j = await r.json();
    // Defence in depth: keep only the three public fields, whatever the server sends.
    data = { supporters: Number(j.supporters) || 0, recent: (j.recent || []).slice(0, 12).map(x => ({ where: String(x.where || ''), ago_s: Number(x.ago_s) || 0 })), names: (j.names || []).slice(0, 200).map(String) };
  } catch { data = null; }
  render();
}

/* ---------------- votes: free, one per person per proposal (local until a backend exists) ---------------- */
const myVotes = () => { try { return new Set(JSON.parse(localStorage.getItem('cube-kas-votes') || '[]')); } catch { return new Set(); } };
function vote(p) { const s = myVotes(); s.has(p) ? s.delete(p) : s.add(p); try { localStorage.setItem('cube-kas-votes', JSON.stringify([...s])); } catch {} render(); window.dispatchEvent(new CustomEvent('cube-ab', { detail: { type: 'kas-vote', door: p } })); }

/* ---------------- render ---------------- */
function ago(s) { return s < 60 ? t('just') : s < 3600 ? Math.round(s / 60) + ' ' + t('min') : Math.round(s / 3600) + ' ' + t('h'); }
function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = t(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(e => e.innerHTML = t(e.dataset.i18nHtml));
  const target = data?.supporters, fmt = new Intl.NumberFormat(lang);
  $('nl').textContent = t('people');
  $('n').textContent = target == null ? '—' : fmt.format(target);
  // goal in people
  const max = MILESTONES.at(-1)[0], pos = v => Math.min(100, 100 * Math.log1p(v) / Math.log1p(max));   // log scale so 10 is visible next to 500
  $('fill').style.width = pos(target ?? 0) + '%';
  $('goal').querySelectorAll('.ms').forEach(e => e.remove());
  MILESTONES.forEach(([v, k]) => { const m = document.createElement('div'); m.className = 'ms' + (target >= v ? ' on' : ''); m.style.left = pos(v) + '%'; m.innerHTML = `<span><b>${fmt.format(v)}</b>${t(k)}</span>`; $('goal').append(m); });
  $('goal').setAttribute('aria-label', `${(target == null ? '—' : fmt.format(target))} ${t('people')}`);
  // the felt
  const mine = myVotes();
  $('felt').replaceChildren(...PROPOSALS.map(p => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'spot'; b.setAttribute('aria-pressed', mine.has(p));
    const n = mine.has(p) ? 1 : 0;
    b.innerHTML = `<span><b>${t(p)}</b><br><small>${t(p + '_s')}</small></span><span class="chips">${'<i></i>'.repeat(Math.min(n, 18))}</span><span class="v">${fmt.format(n)} ${t('chips')}${mine.has(p) ? ' · ' + t('voted') : ''}</span>`;
    b.onclick = () => vote(p); return b;
  }));
  // ticker: where and when, never how much
  const items = (data?.recent || []).map(r => `<span>☕ ${t('ago', { w: r.where.replace(/[<>&]/g, ''), t: ago(r.ago_s) })}</span>`).join('');
  $('ticker').innerHTML = items ? `<div>${items}${items}</div>` : '';
  $('wall').replaceChildren(...(data?.names || []).map(n => { const s = document.createElement('span'); s.textContent = n; return s; }));
}

/* ---------------- the Nar: an original jester, drawn then printed as halftone ---------------- */
function drawNar() {
  const c = $('nar'), d = Math.min(2, devicePixelRatio || 1), W = c.clientWidth * d, H = c.clientHeight * d; if (!W) return;
  c.width = W; c.height = H;
  const off = document.createElement('canvas'); off.width = W; off.height = H; const o = off.getContext('2d');
  const s = Math.min(W / 370, H / 450), X = x => W / 2 + x * s, Y = y => H * .54 + y * s;   // horns and bells fit inside the frame
  const lum = (v) => `rgb(${v},${v},${v})`;
  // body + motley diamonds
  o.fillStyle = lum(70); o.beginPath(); o.moveTo(X(-95), Y(190)); o.quadraticCurveTo(X(-80), Y(40), X(0), Y(30)); o.quadraticCurveTo(X(80), Y(40), X(95), Y(190)); o.fill();
  for (let i = -3; i <= 3; i++) for (let j = 0; j < 4; j++) { if ((i + j) % 2) continue; o.fillStyle = lum(140); o.beginPath(); const cx = X(i * 26), cy = Y(70 + j * 34); o.moveTo(cx, cy - 16 * s); o.lineTo(cx + 13 * s, cy); o.lineTo(cx, cy + 16 * s); o.lineTo(cx - 13 * s, cy); o.fill(); }
  // collar points
  o.fillStyle = lum(210); o.beginPath(); for (let i = 0; i <= 8; i++) { const a = Math.PI * (1.05 + i * .1125), r = i % 2 ? 46 : 78; o.lineTo(X(Math.cos(a) * -r * .95), Y(28 + Math.abs(Math.sin(a)) * r * .5)); } o.fill();
  // face
  const g = o.createRadialGradient(X(-10), Y(-34), 4 * s, X(0), Y(-20), 52 * s); g.addColorStop(0, lum(235)); g.addColorStop(1, lum(120));
  o.fillStyle = g; o.beginPath(); o.ellipse(X(0), Y(-22), 40 * s, 48 * s, 0, 0, 7); o.fill();
  o.fillStyle = lum(20); o.beginPath(); o.ellipse(X(-14), Y(-30), 4 * s, 6 * s, 0, 0, 7); o.ellipse(X(14), Y(-30), 4 * s, 6 * s, 0, 0, 7); o.fill();
  o.strokeStyle = lum(30); o.lineWidth = 3 * s; o.beginPath(); o.arc(X(0), Y(-12), 18 * s, .15 * Math.PI, .85 * Math.PI); o.stroke();       // the knowing smile
  // the cap: three horns
  const horn = (dir) => { o.beginPath(); o.moveTo(X(-34 * (dir === 0 ? .6 : 1) + (dir === 1 ? 50 : 0)), Y(-62)); };
  o.fillStyle = lum(95);
  [[-1, -150, -125], [0, 0, -190], [1, 150, -125]].forEach(([k, tx, ty]) => { o.beginPath(); o.moveTo(X(-38 + k * 6), Y(-58)); o.quadraticCurveTo(X(tx * .4), Y(ty * .55), X(tx), Y(ty)); o.quadraticCurveTo(X(tx * .5 + 10 * k), Y(ty * .45), X(38 + k * 6), Y(-58)); o.closePath(); o.fill(); });
  o.fillStyle = lum(170); o.fillRect(X(-42), Y(-66), 84 * s, 12 * s);                                                                          // band
  const data = o.getImageData(0, 0, W, H).data, x = c.getContext('2d'), step = Math.round(5 * d);
  for (let y = step / 2; y < H; y += step) for (let xx = step / 2; xx < W; xx += step) {
    const i = (Math.floor(y) * W + Math.floor(xx)) * 4, a = data[i + 3] / 255; if (!a) continue; const l = data[i] / 255;
    x.fillStyle = l > .6 ? `rgba(239,231,210,${.45 + .5 * l})` : `rgba(${Math.round(91 + 60 * l)},${Math.round(62 + 50 * l)},${Math.round(140 + 60 * l)},${.5 + .5 * l})`;   // Corvus violet shadows, cream light
    x.beginPath(); x.arc(xx, y, Math.max(.6, l * step * .55), 0, 7); x.fill();
  }
  nar.bells = [[-150, -125], [0, -190], [150, -125]].map(([bx, by]) => [X(bx), Y(by), 11 * s]);
  nar.base = x.getImageData(0, 0, W, H);
}
const nar = { bells: [], base: null };
function bells(tm) {
  const c = $('nar'), x = c.getContext('2d'); if (!nar.base) return requestAnimationFrame(bells);
  x.putImageData(nar.base, 0, 0);
  nar.bells.forEach(([bx, by, r], i) => { const sw = reduced ? 0 : Math.sin(tm * .006 + i * 1.7) * r * .5;
    const g = x.createRadialGradient(bx + sw, by, 0, bx + sw, by, r * 3); g.addColorStop(0, 'rgba(255,215,106,.85)'); g.addColorStop(.35, 'rgba(255,215,106,.25)'); g.addColorStop(1, 'transparent');
    x.fillStyle = g; x.beginPath(); x.arc(bx + sw, by, r * 3, 0, 7); x.fill(); x.fillStyle = '#ffe9a8'; x.beginPath(); x.arc(bx + sw, by, r, 0, 7); x.fill(); });
  if (!reduced) requestAnimationFrame(bells);
}

/* ---------------- the ring: 54 lights, a circus ring around one number ---------------- */
function ring(tm) {
  const c = $('ring'), d = Math.min(2, devicePixelRatio || 1), W = c.clientWidth * d; if (c.width !== W) { c.width = W; c.height = W; }
  const x = c.getContext('2d'), R = W * .46, cx = W / 2; x.clearRect(0, 0, W, W);
  const lit = data ? Math.min(54, data.supporters) : 0;
  for (let i = 0; i < 54; i++) { const a = -Math.PI / 2 + i / 54 * Math.PI * 2 + (reduced ? 0 : tm * .00008), on = i < lit, blink = on && !reduced && Math.sin(tm * .004 + i) > .6;
    x.fillStyle = on ? (blink ? '#fff3c4' : '#ffd76a') : 'rgba(122,92,176,.35)'; x.beginPath(); x.arc(cx + Math.cos(a) * R, cx + Math.sin(a) * R, (on ? 3.4 : 2.4) * d, 0, 7); x.fill(); }
  x.strokeStyle = 'rgba(122,92,176,.3)'; x.lineWidth = d; x.beginPath(); x.arc(cx, cx, R * .9, 0, 7); x.stroke();
  requestAnimationFrame(ring);
}

mountPolyglot(code => { lang = code; render(); });
render();
if (feed) { load(); setInterval(load, 10000); }
drawNar(); requestAnimationFrame(bells); requestAnimationFrame(ring);
addEventListener('resize', () => { clearTimeout(drawNar.t); drawNar.t = setTimeout(drawNar, 150); });
</script>
<script type="module" src="../coffee.js"></script>

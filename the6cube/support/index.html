<style>
/* the support ladder: three ways to help, from free to coffee. same ritual light as the arrival. */
:root{--bg:#060509;--line:#2c1f45;--violet:#7a5cb0;--lav:#b4a0d6;--gold:#ffd76a;--cream:#efe7d2;--dim:rgba(239,231,210,.6);--serif:'Bodoni Moda',Georgia,serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--cream);font:16px/1.55 system-ui,sans-serif}
body{margin:0;padding-top:28px;min-height:100vh;background:radial-gradient(ellipse at 50% 18%,rgba(30,19,50,.9),var(--bg) 60%)}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
header,main{position:relative;z-index:1}
header{display:flex;justify-content:space-between;padding:16px 22px;font:11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
header a{color:inherit;text-decoration:none}
main{max-width:720px;margin:0 auto;padding:4vh 22px 80px;text-align:center}
.motto{font:500 11px var(--serif);letter-spacing:.9em;margin:0 -0.9em 18px 0;color:rgba(255,215,106,.42)}
.raven{width:86px;height:86px;margin:0 auto 18px;filter:drop-shadow(0 0 24px rgba(122,92,176,.6))}
h1{font:italic 400 clamp(32px,5vw,50px)/1.12 var(--serif);margin:0 0 12px}
h1 em{color:var(--gold)}
.lead{color:var(--dim);max-width:46ch;margin:0 auto 40px}
ol{list-style:none;padding:0;margin:0;display:grid;gap:16px;text-align:left}
li{position:relative;display:grid;grid-template-columns:64px 1fr;gap:18px;align-items:start;padding:22px 22px 20px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(160deg,rgba(26,18,42,.78),rgba(10,8,16,.82));backdrop-filter:blur(6px)}
li .n{font:italic 400 40px/1 var(--serif);color:var(--gold);text-shadow:0 0 18px rgba(255,215,106,.45);text-align:center;padding-top:2px}
li h2{font:400 22px/1.2 var(--serif);margin:0 0 6px;padding-right:64px}
li p{margin:0 0 14px;color:var(--dim);font-size:15px}
li .free{position:absolute;top:14px;right:16px;font:10px var(--mono);letter-spacing:.2em;color:#7ee0b0;border:1px solid rgba(126,224,176,.4);border-radius:999px;padding:2px 8px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{all:unset;cursor:pointer;display:inline-block;padding:10px 16px;border:1px solid rgba(255,215,106,.5);border-radius:2px;font:12px var(--mono);letter-spacing:.18em;color:var(--gold);transition:box-shadow .25s,background .25s}
.btn:hover,.btn:focus-visible{box-shadow:0 0 22px rgba(255,215,106,.3);background:rgba(255,215,106,.06);outline:none}
.btn.q{border-color:var(--line);color:var(--lav)}
.fine{margin-top:34px;font:11.5px/1.6 var(--mono);color:rgba(239,231,210,.4)}
@media(max-width:520px){li{grid-template-columns:44px 1fr;gap:12px;padding:20px 16px}li .n{font-size:32px}}
@media(prefers-reduced-motion:reduce){canvas#fx{display:none}}
.v2first{text-align:center;margin:26px 0 0;font:12px ui-monospace,Menlo,monospace;letter-spacing:.14em}.v2first a{color:#ffd76a;text-decoration:none;border-bottom:1px solid rgba(255,215,106,.35);padding-bottom:2px}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<header><a href="/the6cube/" data-t="back"></a><a href="/the6cube/spread/" data-t="map"></a></header>

  <h1 data-t="h1"></h1>
  <p class="lead" data-t="lead"></p>
  <ol>
    <li><span class="n">I</span><span class="free" data-t="free"></span><div><h2 data-t="s1h"></h2><p data-t="s1p"></p><div class="btns"><button class="btn" id="pass" data-t="s1b"></button><a class="btn q" href="/the6cube/spread/" data-t="s1m"></a></div></div></li>
    <li><span class="n">II</span><span class="free" data-t="free"></span><div><h2 data-t="s2h"></h2><p data-t="s2p"></p><div class="btns"><a class="btn" href="/the6cube/brein/#lend" data-t="s2b"></a></div></div></li>
    <li><span class="n">III</span><div><h2 data-t="s3h"></h2><p data-t="s3p"></p><div class="btns"><a class="btn" href="https://revolut.me/gabe6maxxing" target="_blank" rel="noopener">Revolut</a><a class="btn q" href="https://buymeacoffee.com/gabe.maxxing" target="_blank" rel="noopener">Buy Me a Coffee</a></div></div></li>
  </ol>
<p class="v2first"><a href="mailto:gabriel@corvus.gent?subject=v2%20first&body=Send%20me%20The%206%20Cube%20v2%20first." >✉ get v2 first</a></p>
  <p class="fine" data-t="fine"></p>
</main>
<script type="module">

  de: { back: '← 🏛️ the cube', map: 'das Myzel ↗', h1: 'Wenn du <em>unterstützen</em> willst', lead: 'Drei Wege, von gratis bis Kaffee. Die ersten zwei kosten nichts.', free: 'GRATIS', s1h: 'Schick es einer Person', s1p: 'Einer. Dein Link trägt deinen Rang, sie landet einen Ring weiter draußen. Dann sieh deinen Ast im Myzel wachsen.', s1b: 'WEITERGEBEN ↗', s1m: 'DAS MYZEL ANSEHEN', s2h: 'Leih dem Gehirn einen Schlüssel', s2p: 'Ein API-Schlüssel, auch ein kostenloser. Der Rat des Ostens denkt etwas mehr damit, nie mehr als du erlaubst. Jederzeit widerrufbar.', s2b: 'SCHLÜSSEL LEIHEN →', s3h: 'Spendier mir einen Kaffee', s3p: 'Wenn es dich zum Denken brachte. Jeder Kaffee wird Rechenzeit.', fine: 'Eine Spende ist ein freiwilliges Geschenk an Gabriel persönlich. Du bekommst nichts dafür. Beträge werden nie gezeigt oder gespeichert.' },
  zh: { back: '← 🏛️ the cube', map: '菌丝网络 ↗', h1: '如果你想<em>支持</em>', lead: '三种方式，从免费到一杯咖啡。前两种不花一分钱。', free: '免费', s1h: '发给一个人', s1p: '一个就好。你的链接带着你的环数，对方会落在更外一环。然后在菌丝网络上看你的分支生长。', s1b: '传下去 ↗', s1m: '看菌丝网络', s2h: '借给大脑一把钥匙', s2p: '一个 API 密钥，免费的也行。东方议会会用它多想一点，但绝不超过你允许的。随时可撤回。', s2b: '借出密钥 →', s3h: '请我喝杯咖啡', s3p: '如果它让你思考了。每杯咖啡都会变成算力。', fine: '捐赠是给 Gabriel 个人的自愿赠与。你不会得到任何回报。本站从不显示或保存金额。' },

const cv = document.getElementById('fx'), c = cv.getContext('2d'); let W, H;

const R = Math.random, fe = Array.from({ length: 9 }, () => ({ x: R() * innerWidth, y: R() * innerHeight, s: 8 + R() * 14, v: .2 + R() * .4, a: R() * 6, gold: R() < .25 }));

[package]
name = "corvus-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
url = "2"
regex = "1"

[lints.rust]
unsafe_code = "forbid"

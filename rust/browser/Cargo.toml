[package]
name = "corvus-browser"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
corvus-core = { path = "../core" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlDocument", "Element", "HtmlElement", "HtmlAnchorElement", "MouseEvent", "PageTransitionEvent", "MediaQueryList", "DomTokenList", "Event", "EventTarget", "Location", "NodeList", "Storage", "Navigator", "Url", "UrlSearchParams", "History", "CustomEvent", "CustomEventInit", "FocusOptions", "CssStyleDeclaration", "DomRect", "ResizeObserver", "Request", "RequestInit", "Response", "AbortSignal"] }

[lints.rust]
unsafe_code = "forbid"

[package]
name = "corvus-browser"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# One runtime per document: small public shell, opt-in page domains. No duplicate
# locale/consent/auth state from independently initialized WASM islands.
[features]
default = ["full"]
full = ["army", "battle", "compound", "impact", "interviews", "legion", "support"]
army = []
battle = []
compound = ["impact"]
impact = []
interviews = []
legion = ["impact"]
support = []

[dependencies]
corvus-core = { path = "../core" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1"
url = "2"
regex = "1"
web-sys = { version = "0.3", features = ["console", "Window", "Document", "DocumentFragment", "HtmlDocument", "Element", "HtmlElement", "HtmlAnchorElement", "MouseEvent", "KeyboardEvent", "PointerEvent", "Performance", "AddEventListenerOptions", "PageTransitionEvent", "MediaQueryList", "DomTokenList", "Event", "EventTarget", "Location", "NodeList", "Storage", "Navigator", "Url", "UrlSearchParams", "History", "CustomEvent", "CustomEventInit", "FocusOptions", "CssStyleDeclaration", "DomRect", "ResizeObserver", "Request", "RequestInit", "RequestCache", "Response", "AbortSignal", "AbortController", "Headers", "FormData", "HtmlFormElement", "HtmlInputElement", "HtmlButtonElement", "HtmlSelectElement", "ScrollIntoViewOptions", "ScrollBehavior", "ScrollLogicalPosition", "Crypto", "HtmlVideoElement", "HtmlMediaElement", "MediaError", "HtmlDetailsElement", "HtmlTextAreaElement", "Clipboard", "StorageEvent", "RequestCredentials", "ReferrerPolicy", "MutationObserver", "MutationObserverInit", "MutationRecord", "HtmlImageElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "File", "FileList", "Blob", "BlobPropertyBag", "HtmlDialogElement", "VisualViewport", "ScrollToOptions", "IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit"] }
qrcodegen = "=1.8.0"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"

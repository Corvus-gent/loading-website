<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="color-scheme" content="dark"><title>The shark is coming · corvus.gent</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#061824;color:#cfeef3;font:16px/1.6 ui-monospace,monospace;display:grid;place-items:center;padding:28px}main{width:min(700px,100%)}.prompt{color:#56d7d2;font-size:clamp(12px,2.5vw,16px)}h1{font-size:clamp(34px,8vw,76px);line-height:1.05;letter-spacing:-.05em;margin:.5em 0}.shark{font-size:clamp(20px,5vw,38px);color:#56d7d2;margin:32px 0}#countdown{font-size:clamp(68px,20vw,140px);line-height:1.2;color:#ffdc7c;font-variant-numeric:tabular-nums}p{max-width:48ch;color:#92afb9}a{color:#56d7d2;text-underline-offset:5px}nav{display:flex;flex-wrap:wrap;gap:18px;margin-top:34px}a:focus-visible{outline:2px solid #ffdc7c;outline-offset:6px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(prefers-reduced-motion:no-preference){.shark{animation:swim 5s ease-in-out infinite}@keyframes swim{50%{transform:translateX(15px)}}}body[data-hidden=true] .shark{animation-play-state:paused}
</style></head><body><main><div class="prompt">gabe@corvus:~$ ./salesforce --loading</div><div class="shark" aria-hidden="true">&lt;°)))&gt;&lt;</div><h1>The shark is coming.</h1><div id="countdown" aria-live="off">20:00</div><span class="sr">Opens at 21:17 Gent time, 23 November 2026.</span><p>A little water. A little ambition. Dive back in when the timer hits zero.</p><nav aria-label="Meanwhile"><a href="https://github.com/gabe-maxxing">GitHub</a><a href="https://corvus.gent">corvus.gent</a><a href="mailto:gabriel@corvus.gent">gabriel@corvus.gent</a></nav></main><script>
const TARGET=Date.parse('2026-11-23T20:17:32Z'),display=document.getElementById('countdown');let reloadAt=0;
function tick(){if(document.hidden)return;const left=Math.max(0,Math.ceil((TARGET-Date.now())/1000));display.textContent=left?String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0'):'dropping any second…';if(!left){display.style.fontSize='clamp(26px,7vw,54px)';if(!reloadAt)reloadAt=Date.now()+20000;else if(Date.now()>=reloadAt){reloadAt=Date.now()+20000;location.reload();}}}
tick();setInterval(tick,1000);document.addEventListener('visibilitychange',()=>{document.body.dataset.hidden=String(document.hidden);tick();});
</script></body></html>

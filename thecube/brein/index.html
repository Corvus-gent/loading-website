:root{--bg:#060509;--line:#2c1f45;--violet:#7a5cb0;--lav:#b4a0d6;--gold:#ffd76a;--cream:#efe7d2;--dim:rgba(239,231,210,.55);--serif:'Bodoni Moda',Didot,Georgia,serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box;min-width:0}
html{background:var(--bg);color:var(--cream);font:15px/1.55 system-ui,sans-serif}
body{margin:0;padding-top:28px;overflow-x:clip}
a{color:inherit}
.wrap{width:min(1180px,100% - 32px);margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0;font:11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
header a{text-decoration:none}
.stage{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:28px;align-items:center;min-height:calc(100svh - 100px)}
.sky{position:relative;aspect-ratio:1/1;width:100%;max-width:600px;justify-self:center}
.sky canvas{position:absolute;inset:0;width:100%;height:100%}
.kicker{font:11px var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--lav);margin:0 0 14px}
.line{font:italic 400 clamp(28px,3.4vw,44px)/1.15 var(--serif);margin:0 0 18px;text-wrap:balance}
.line em{color:var(--gold)}
.lead{color:var(--dim);max-width:46ch;margin:0 0 22px}
.live{display:flex;align-items:baseline;gap:12px;margin:0 0 22px}
.live .n{font:700 clamp(48px,6vw,72px)/1 var(--serif);color:var(--gold)}
.live .l{font:12px var(--mono);color:var(--dim);letter-spacing:.06em}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);margin-right:6px;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{50%{opacity:.25}}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:12px 20px;min-height:48px;font:600 15px system-ui,sans-serif;text-decoration:none;border:1px solid var(--violet);color:var(--cream);background:rgba(27,18,48,.7);cursor:pointer}
.btn.gold{background:var(--gold);color:#1a1206;border-color:var(--gold)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
section{padding:56px 0;border-top:1px solid var(--line)}
h2{font:400 clamp(24px,2.6vw,32px)/1.15 var(--serif);margin:0 0 6px}
.sub{font:12px var(--mono);color:var(--dim);margin:0 0 22px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;counter-reset:s}
.step{border:1px solid var(--line);border-radius:16px;padding:18px;background:rgba(27,18,48,.35)}
.step::before{counter-increment:s;content:counter(s);display:block;font:700 30px var(--serif);color:var(--gold);margin-bottom:6px}
.step b{display:block;font:400 19px/1.2 var(--serif);margin-bottom:6px}
.step p{margin:0;color:var(--dim);font-size:14px}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:8px;font:13px var(--mono)}
.feed li{display:flex;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:10px}
.feed li span{color:var(--dim)}
.feed a{text-decoration:none}
.feed .empty{color:var(--dim);font-style:italic;border-style:dashed}
.council{display:flex;flex-wrap:wrap;gap:8px}
.council span{font:12px var(--mono);border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--cream)}
.council span i{font-style:normal;color:var(--dim);margin-left:6px}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:22px}
.tier{border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:8px;align-content:start}
.tier.on{border-color:var(--gold);background:rgba(255,215,106,.06)}
.tier .p{font:700 40px/1 var(--serif);color:var(--gold)}
.tier b{font:400 20px var(--serif)}
.tier p{margin:0;color:var(--dim);font-size:14px}
.tier .soon{font:11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--lav)}
.fine{font:11.5px/1.6 var(--mono);color:var(--dim);max-width:80ch;margin-top:16px}
footer{padding:30px 0 50px;font:12px var(--mono);color:var(--dim);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line)}
footer a{text-decoration:none;margin-left:14px}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media(max-width:860px){.stage{grid-template-columns:minmax(0,1fr);min-height:0;padding-top:10px}.sky{max-width:340px;order:2}.steps,.tiers{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const t = k => (T[lang] && T[lang][k]) ?? T.en[k];
let thoughts = null;

function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = t(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(e => e.innerHTML = t(e.dataset.i18nHtml));
  document.getElementById('one').textContent = coin;
  const mail = `mailto:hello@corvus.gent?subject=${encodeURIComponent(t('subj'))}&body=${encodeURIComponent(t('body') + `\n\n(${cur} · ${lang})`)}`;
  document.getElementById('mail').href = mail;
  document.getElementById('council').innerHTML = COUNCIL.map(([n, r]) => `<span>${n}<i>${r}</i></span>`).join('');
  renderFeed();
}

function renderFeed() {
  const ul = document.getElementById('feed');
  document.getElementById('count').textContent = thoughts ? thoughts.total : '·';
  if (!thoughts || !thoughts.items.length) { ul.innerHTML = `<li class="empty">${t('empty')}</li>`; return; }
  ul.innerHTML = thoughts.items.map(i => `<li><span>${new Date(i.created_at).toLocaleString(lang, { dateStyle: 'short', timeStyle: 'short' })}</span><a href="${i.html_url}" target="_blank" rel="noopener">${i.title.replace(/[<>&]/g, '')}</a></li>`).join('');
}

// live: the shared brain is a free public inbox (ntfy.sh), mirrored into git. no key, cached 1 min.
const BRAIN = 'corvus-brain-1729';
async function load() {
  const key = 'cube-brain-cache';
  try { const c = JSON.parse(sessionStorage.getItem(key) || 'null'); if (c && Date.now() - c.at < 60000) { thoughts = c.v; renderFeed(); return; } } catch {}
  try {
    const r = await fetch(`https://ntfy.sh/${BRAIN}/json?poll=1&since=all`);
    if (!r.ok) throw 0;
    const msgs = (await r.text()).split('\n').filter(Boolean).map(l => JSON.parse(l)).filter(m => m.event === 'message').sort((a, b) => b.time - a.time);
    thoughts = { total: msgs.length, items: msgs.slice(0, 6).map(m => ({ title: m.title || (m.message || '').slice(0, 60), html_url: `https://ntfy.sh/${BRAIN}`, created_at: new Date(m.time * 1000).toISOString() })) };
    try { sessionStorage.setItem(key, JSON.stringify({ at: Date.now(), v: thoughts })); } catch {}
  } catch { thoughts = thoughts || { total: 0, items: [] }; }
  renderFeed();
}
setInterval(load, 60000);

// the sky: one node per council member on two rings, threads between neighbours, gold pulses travel inward
const cv = document.getElementById('sky'), cx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, nodes = [], pulses = [];
function size() {
  const dpr = Math.min(devicePixelRatio || 1, 2), b = cv.getBoundingClientRect();
  W = b.width; H = b.height; cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const R = Math.min(W, H) / 2;
  nodes = COUNCIL.map(([n], i) => { const ring = i % 2, a = i / COUNCIL.length * Math.PI * 2 + ring * .13; const r = R * (ring ? .62 : .86); return { n, x: W / 2 + Math.cos(a) * r, y: H / 2 + Math.sin(a) * r, ph: i }; });
}
function frame(ts) {
  cx.clearRect(0, 0, W, H);
  const c = { x: W / 2, y: H / 2 };
  cx.lineWidth = 1;
  nodes.forEach((p, i) => {
    const q = nodes[(i + 2) % nodes.length], s = nodes[(i + 5) % nodes.length];
    cx.strokeStyle = 'rgba(122,92,176,.22)'; cx.beginPath(); cx.moveTo(p.x, p.y); cx.lineTo(q.x, q.y); cx.moveTo(p.x, p.y); cx.lineTo(s.x, s.y); cx.stroke();
    cx.strokeStyle = 'rgba(122,92,176,.12)'; cx.beginPath(); cx.moveTo(p.x, p.y); cx.lineTo(c.x, c.y); cx.stroke();
  });
  if (!reduce && Math.random() < .05) pulses.push({ from: nodes[Math.random() * nodes.length | 0], t: 0 });
  pulses = pulses.filter(p => (p.t += .012) < 1);
  pulses.forEach(p => { const x = p.from.x + (c.x - p.from.x) * p.t, y = p.from.y + (c.y - p.from.y) * p.t; cx.fillStyle = `rgba(255,215,106,${1 - p.t * .6})`; cx.beginPath(); cx.arc(x, y, 2.2, 0, 7); cx.fill(); });
  nodes.forEach(p => {
    const tw = .55 + .45 * Math.sin(ts / 900 + p.ph);
    cx.fillStyle = `rgba(239,231,210,${.5 + .5 * tw})`; cx.beginPath(); cx.arc(p.x, p.y, 3, 0, 7); cx.fill();
    cx.fillStyle = 'rgba(239,231,210,.45)'; cx.font = '10px ui-monospace,monospace'; cx.textAlign = 'center'; cx.fillText(p.n, p.x, p.y - 9);
  });
  const g = cx.createRadialGradient(c.x, c.y, 0, c.x, c.y, 46); g.addColorStop(0, 'rgba(255,215,106,.9)'); g.addColorStop(.25, 'rgba(255,215,106,.35)'); g.addColorStop(1, 'rgba(255,215,106,0)');
  cx.fillStyle = g; cx.beginPath(); cx.arc(c.x, c.y, 46, 0, 7); cx.fill();
  cx.fillStyle = '#1a1206'; cx.font = '700 15px "Bodoni Moda",serif'; cx.fillText('盖', c.x, c.y + 5);
  if (!reduce) requestAnimationFrame(frame);
}
addEventListener('resize', size);
size(); requestAnimationFrame(frame);

render();
mountPolyglot(code => { lang = code; render(); });
load();
</script>
<script type="module" src="../coffee.js"></script>

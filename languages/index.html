<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Languages | corvus.gent</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/people/styles.css" />
  <meta name="description" content="Seven languages. Honest scores." />
  <meta property="og:title" content="Languages | corvus.gent" />
  <meta property="og:description" content="Seven languages. Honest scores." />
  <meta property="og:url" content="https://corvus.gent/languages/" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://corvus.gent/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://corvus.gent/og.png" />
</head>
<body class="people-page">
  <main>
    <div class="wrap">
      <div class="lang-switcher" id="lang-switcher"></div>
      <div class="tag"><a href="/">corvus.gent</a> / languages</div>
      <h1 data-i18n="lang.title">polyglot stats</h1>
      <p class="sub" data-i18n="lang.sub"></p>
      <section class="langs">
        <div class="lrow"><span class="lname">English</span><span class="lbar"><span style="--w:97%"></span></span><span class="lval">97%</span></div>
        <div class="lrow"><span class="lname">Nederlands</span><span class="lbar"><span style="--w:99%"></span></span><span class="lval">99%</span></div>
        <div class="lrow"><span class="lname">Español</span><span class="lbar"><span style="--w:88%"></span></span><span class="lval">88%</span></div>
        <div class="lrow"><span class="lname">Français</span><span class="lbar"><span style="--w:72%"></span></span><span class="lval">72%</span></div>
        <div class="lrow"><span class="lname">Português</span><span class="lbar"><span style="--w:44%"></span></span><span class="lval">44%</span></div>
        <div class="lrow"><span class="lname">Deutsch</span><span class="lbar"><span style="--w:33%"></span></span><span class="lval">33%</span></div>
        <div class="lrow"><span class="lname">中文</span><span class="lbar"><span style="--w:1%"></span></span><span class="lval">1%</span></div>
        <p class="sub lnote" data-i18n="lang.zh.note"></p>
      </section>

      <section class="suggest">
        <p data-i18n="sug.q">Which language should I learn next?</p>
        <form id="sug-form" class="access-form">
          <select name="language" id="sug-lang" required>
            <option value="" data-i18n="sug.pick">pick one</option>
            <option>日本語 (Japanese)</option><option>한국어 (Korean)</option><option>Italiano</option><option>العربية (Arabic)</option><option>Русский (Russian)</option><option>हिन्दी (Hindi)</option><option>Türkçe</option><option>Svenska</option><option>Polski</option><option>Ελληνικά (Greek)</option>
            <option value="other" data-i18n="sug.other">other</option>
          </select>
          <div id="sug-more" style="display:none; width:100%">
            <input type="text" name="why" data-i18n-placeholder="sug.why" placeholder="why? (convince me in one line)" maxlength="200">
            <button type="submit" data-i18n="sug.send">send</button>
          </div>
        </form>
        <p class="sub" id="sug-done" style="display:none" data-i18n="sug.thanks"></p>
      </section>
      <footer>© <span id="y"></span> corvus</footer>
    </div>
  </main>
  <script type="module">
    import { initI18n } from "/js/i18n.js";
    import { setFooterYear } from "/js/utils.js";
    setFooterYear();
    initI18n();
    requestAnimationFrame(() => document.querySelector(".langs").classList.add("go"));
    const form = document.getElementById("sug-form");
    document.getElementById("sug-lang").addEventListener("change", e => {
      document.getElementById("sug-more").style.display = e.target.value ? "flex" : "none";
    });
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const language = form.language.value, why = form.why.value;
      try {
        await fetch("https://formsubmit.co/ajax/gabriel@corvus.gent", {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({ language, why, _subject: "🗣️ Language suggestion: " + language }),
        });
      } catch {}
      if (window.posthog?.capture) window.posthog.capture("language_suggestion", { language });
      form.style.display = "none";
      document.getElementById("sug-done").style.display = "block";
    });
  </script>
  <script src="/js/analytics.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Languages | corvus.gent</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/people/styles.css" />
  <meta name="description" content="Seven languages. Honest scores." />
  <meta property="og:title" content="Languages | corvus.gent" />
  <meta property="og:description" content="Seven languages. Honest scores." />
  <meta property="og:url" content="https://corvus.gent/languages/" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://corvus.gent/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://corvus.gent/og.png" />
</head>
<body class="people-page">
  <main>
    <div class="wrap">
      <div class="lang-switcher" id="lang-switcher"></div>
      <div class="tag"><a href="/">corvus.gent</a> / languages</div>
      <h1 data-i18n="lang.title">polyglot stats</h1>
      <p class="sub" data-i18n="lang.sub"></p>
      <section class="langs">
        <div class="lrow"><span class="lname">English</span><span class="lbar"><span style="--w:97%"></span></span><span class="lval">97%</span></div>
        <div class="lrow"><span class="lname">Nederlands</span><span class="lbar"><span style="--w:99%"></span></span><span class="lval">99%</span></div>
        <div class="lrow"><span class="lname">Español</span><span class="lbar"><span style="--w:88%"></span></span><span class="lval">88%</span></div>
        <div class="lrow"><span class="lname">Français</span><span class="lbar"><span style="--w:72%"></span></span><span class="lval">72%</span></div>
        <div class="lrow"><span class="lname">Português</span><span class="lbar"><span style="--w:44%"></span></span><span class="lval">44%</span></div>
        <div class="lrow"><span class="lname">Deutsch</span><span class="lbar"><span style="--w:33%"></span></span><span class="lval">33%</span></div>
        <div class="lrow"><span class="lname">中文</span><span class="lbar"><span style="--w:1%"></span></span><span class="lval">1%</span></div>
        <p class="sub lnote" data-i18n="lang.zh.note"></p>
      </section>

      <section class="suggest">
        <p data-i18n="sug.q">Which language should I learn next?</p>
        <select id="sug-lang" aria-label="language"><option value="" data-i18n="sug.pick">pick one</option></select>
        <p class="sub" id="sug-status"></p>
        <div id="sug-results"></div>
      </section>
      <footer>© <span id="y"></span> corvus</footer>
    </div>
  </main>
  <script type="module">
    import { initI18n } from "/js/i18n.js";
    import { setFooterYear } from "/js/utils.js";
    setFooterYear();
    initI18n();
    requestAnimationFrame(() => document.querySelector(".langs").classList.add("go"));
    const MINE = ["en", "nl", "es", "fr", "pt", "de", "zh"];
    const CODES = "af am ar as az be bg bn bo br bs ca cs cy da dz el eo et eu fa fi fil fo ga gd gl gu ha he hi hr ht hu hy id ig is it ja jv ka kk km kn ko ku ky la lb lo lt lv mg mi mk ml mn mr ms mt my ne no or pa pl ps qu ro ru rw sa sd si sk sl sm so sq sr su sv sw ta te tg th ti tk tl tr tt ug uk ur uz vi wo xh yi yo zu".split(" ").filter(c => !MINE.includes(c));
    const names = new Intl.DisplayNames(["en"], { type: "language" });
    const label = c => { try { const own = new Intl.DisplayNames([c], { type: "language" }).of(c); const en = names.of(c); return own && own !== en ? `${en} (${own})` : en; } catch { return c; } };
    const sel = document.getElementById("sug-lang");
    CODES.map(c => [c, label(c)]).sort((a, b) => a[1].localeCompare(b[1])).forEach(([c, l]) => {
      const o = document.createElement("option"); o.value = c; o.textContent = l; sel.appendChild(o);
    });

    function render(votes) {
      const box = document.getElementById("sug-results");
      const rows = Object.entries(votes || {}).sort((a, b) => b[1] - a[1]).slice(0, 8);
      const max = Math.max(1, ...rows.map(r => r[1]));
      box.innerHTML = "";
      rows.forEach(([c, n]) => {
        const row = document.createElement("div");
        row.className = "lrow";
        row.innerHTML = `<span class="lname"></span><span class="lbar"><span style="width:${(n / max) * 100}%"></span></span><span class="lval">${n}</span>`;
        row.querySelector(".lname").textContent = names.of(c);
        box.appendChild(row);
      });
    }
    async function load(method = "GET", lang) {
      try {
        const r = await fetch("/api/vote", method === "POST"
          ? { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify({ lang }) }
          : { cache: "no-store" });
        if (!r.ok) throw 0;
        render((await r.json()).votes);
      } catch { document.getElementById("sug-status").textContent = "voting opens soon."; }
    }
    let voted = null; try { voted = localStorage.getItem("voted_lang"); } catch {}
    if (voted) { sel.value = voted; sel.disabled = true; }
    sel.addEventListener("change", async () => {
      if (!sel.value) return;
      sel.disabled = true;
      try { localStorage.setItem("voted_lang", sel.value); } catch {}
      if (window.posthog?.capture) window.posthog.capture("language_vote", { language: sel.value });
      await load("POST", sel.value);
    });
    load();
    setInterval(load, 10000);
  </script>
  <script src="/js/analytics.js"></script>
</body>
</html>

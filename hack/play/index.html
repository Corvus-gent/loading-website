function draw(){ctx.clearRect(0,0,size,size);ctx.save();if(time<shakeUntil&&!reduced)ctx.translate((Math.random()-.5)*5,(Math.random()-.5)*5);const c=CONFIG.colors;ctx.fillStyle=c.mat;ctx.beginPath();[[5,.5],[15,.5],[20.5,6],[20.5,14],[15,20.5],[5,20.5],[.5,15],[.5,5]].forEach(([x,y],i)=>i?ctx.lineTo(x*cell,y*cell):ctx.moveTo(x*cell,y*cell));ctx.closePath();ctx.fill();ctx.strokeStyle=c.fence;ctx.lineWidth=2;ctx.stroke();ctx.save();ctx.clip();for(let y=0;y<21;y++)for(let x=0;x<21;x++){if(!inside(x,y))continue;box(x*cell,y*cell,cell-1,cell-1,c.grid);if(!walk(x,y)){box(x*cell+2,y*cell+2,cell-4,cell-4,c.wall);box(x*cell+2,y*cell+2,cell-4,2,c.wallEdge);}}
box(3*cell,3*cell,2*cell,2,c.red);box(16*cell,17*cell,2*cell,2,c.blue);for(const[k]of tokens){const x=(k%21+.5)*cell,y=(Math.floor(k/21)+.5)*cell;box(x-1.5,y-1.5,3,3,c.token);}for(const k of powers){const x=(k%21+.5)*cell,y=(Math.floor(k/21)+.5)*cell;ctx.strokeStyle=c.power;ctx.lineWidth=1;ctx.strokeRect(x-cell*.33,y-cell*.23,cell*.66,cell*.46);box(x-cell*.3,y-2,cell*.6,4,'#03040c');box(x,y-2,3,8,c.power);}ctx.restore();
for(const e of enemies){const scared=time<powerUntil;if(time<e.release){ctx.globalAlpha=.35;}const wobble=scared&&!reduced?Math.sin(time*45)*.04:0;fighter({...e,x:e.x+wobble},scared?'#dbe5f7':e.spec.color,false,scared);ctx.globalAlpha=1;const labelX=Math.max(cell*2.4,Math.min(size-cell*2.4,(e.x+.5)*cell));text(e.spec.name,labelX,(e.y+.5)*cell-cell*.85,cell*.29,scared?'#e5ecff':e.spec.color);}
if(time>invincibleUntil||Math.floor(time*9)%2===0||state!=='play')fighter(player,c.gi,true,false);
for(const e of enemies)if(e.bubbleUntil>time){ctx.font='bold '+Math.max(8,Math.floor(cell*.4))+'px monospace';const width=Math.min(size-12,ctx.measureText(e.bubble).width+12),x=Math.max(6,Math.min(size-width-6,(e.x+.5)*cell-width/2)),y=Math.max(10,(e.y-1.6)*cell);box(x,y-9,width,19,'#f2f4e9');ctx.fillStyle='#131524';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e.bubble,x+width/2,y);}
if(flash&&flash.until>time){box(8,size*.44,size-16,cell*1.7,'#0b101fea');text(flash.text,size/2,size*.44+cell*.85,cell*.85,'#d1ff63');}ctx.restore();}
function frame(t){const dt=Math.min(.05,(t-lastTime)/1000||0);lastTime=t;const steps=Math.max(1,Math.ceil(dt/(1/120)));for(let i=0;i<steps;i++)update(dt/steps);draw();requestAnimationFrame(frame);}

let runId=null,runReady=Promise.resolve(),gameDevice;try{gameDevice=JSON.parse(localStorage.getItem('corvus-name-vote-v1')||'{}').device;}catch{}if(!/^[-a-zA-Z0-9_]{16,64}$/.test(gameDevice||'')){gameDevice=crypto.randomUUID();try{localStorage.setItem('corvus-name-vote-v1',JSON.stringify({device:gameDevice}));}catch{}}
async function gameAPI(body){const r=await fetch(CONFIG.api,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({device:gameDevice,...body}),signal:AbortSignal.timeout(7000)});if(!r.ok)throw Error('score service unavailable');return r.json();}
function beginRun(){runId=crypto.randomUUID();runReady=gameAPI({action:'play',run:runId}).catch(()=>null);}
async function postRunScore(){if(!runId)return;const run=runId,value=score;await runReady;try{await gameAPI({action:'score',run,score:value});}catch{}}
async function syncGameTitle(){if(document.hidden)return;try{const r=await fetch(CONFIG.api,{cache:'no-store',signal:AbortSignal.timeout(7000)});if(!r.ok)return;const data=await r.json();if(data.closed&&data.winner){CONFIG.title=data.winner;$('title').textContent=data.winner;document.title=data.winner+' · Corvus Arcade';if(state==='start')$('heading').textContent=data.winner;}}catch{}}
setInterval(()=>{syncGameTitle();if(state==='play')postRunScore();},5000);syncGameTitle();

function showBoard(rows){$('game-board').replaceChildren(...(rows||[]).map(r=>{const li=document.createElement('li');li.textContent=r.name+' · '+r.score;return li;}));}
async function syncBoard(){try{const r=await fetch(CONFIG.api,{cache:'no-store',signal:AbortSignal.timeout(7000)}),d=await r.json();showBoard(d.leaderboard);}catch{}}
$('score-form').onsubmit=async e=>{e.preventDefault();publicName=$('player-name').value.trim().slice(0,16);if(!publicName)return;$('score-note').textContent='POSTING…';try{await runReady;const d=await gameAPI({action:'result',run:runId,score,name:publicName});myRank=d.rank;showBoard(d.leaderboard);$('score-note').textContent='YOU ARE #'+myRank;try{localStorage.setItem('corvus-arcade-name',publicName);}catch{}makeStory();}catch{$('score-note').textContent='Could not post. Your game is saved here; try again.';}};
try{publicName=localStorage.getItem('corvus-arcade-name')||'';$('player-name').value=publicName.slice(0,16);}catch{}
const challenge=new URLSearchParams(location.search),challenger=String(challenge.get('from')||'').replace(/[<>\u0000-\u001f]/g,'').slice(0,20),challengeScore=Math.min(1000000,Math.max(0,parseInt(challenge.get('score'),10)||0));
function calloutURL(){const u=new URL(CONFIG.url);u.searchParams.set('from',publicName||$('player-name').value.trim().slice(0,16)||'a white belt');u.searchParams.set('score',score);return u.href;}
$('callout').onclick=async()=>{const url=calloutURL(),text='I scored '+score+'. Skill issue? Beat me. #jointhearmy';try{if(navigator.share){await navigator.share({title:CONFIG.title,text,url});return;}}catch(e){if(e.name==='AbortError')return;}try{await navigator.clipboard.writeText(text+' '+url);$('score-note').textContent='CALLOUT COPIED';}catch{$('score-note').textContent=url;}};
function makeStory(){const c=document.createElement('canvas');c.width=1080;c.height=1920;const g=c.getContext('2d');g.fillStyle='#080c16';g.fillRect(0,0,1080,1920);for(let y=0;y<1920;y+=32)for(let x=0;x<1080;x+=32){if((x+y)%96===0){g.fillStyle='#142237';g.fillRect(x,y,2,2);}}const line=(t,y,size,color='#f4f5e9')=>{g.textAlign='center';g.fillStyle=color;g.font='900 '+size+'px monospace';while(g.measureText(t).width>960&&size>15)g.font='900 '+(--size)+'px monospace';g.fillText(t,540,y);};line('CORVUS / ARCADE',130,25,'#90a3bf');line(CONFIG.title,270,100,'#c9ff55');line('YOUR FIGHT NIGHT RECAP',340,25);g.strokeStyle='#5c82a4';g.lineWidth=12;g.beginPath();[[370,420],[710,420],[850,560],[850,850],[710,990],[370,990],[230,850],[230,560]].forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.stroke();const blocks=[[470,500,140,100,'#efbd91'],[440,600,200,220,'#e8eee5'],[380,620,60,160,'#e8eee5'],[640,620,60,160,'#e8eee5'],[440,820,70,100,'#e8eee5'],[570,820,70,100,'#e8eee5'],[440,750,200,30,CONFIG.belts[Math.min(round,4)].color],[530,750,30,100,CONFIG.belts[Math.min(round,4)].color]];for(const[x,y,w,h,color]of blocks){g.fillStyle=color;g.fillRect(x,y,w,h);}line(CONFIG.belts[Math.min(round,4)].name+' BELT',1080,60,'#c9ff55');line(score.toLocaleString()+' POINTS',1190,80);line(ko+' KO · '+submissions+' SUBMISSIONS',1270,38);const favorite=Object.entries(techniqueHits).sort((a,b)=>b[1]-a[1])[0]?.[0]||'SURVIVING';line('FAVORITE: '+favorite,1350,31,'#92abc7');line(myRank?'LEADERBOARD #'+myRank:'UNRANKED · POST YOUR SCORE',1420,30,'#ff8ac2');line('SKILL ISSUE?',1590,110,'#c9ff55');line('CALL OUT YOUR FRIENDS.',1670,32);line('corvus.gent/hack/play',1800,42);line('#JOINTHEARMY',1860,27,'#90a3bf');c.toBlob(blob=>{if(blob)storyFile=new File([blob],'corvus-fight-night.png',{type:'image/png'});},'image/png');}
$('story').onclick=async()=>{if(!storyFile){makeStory();$('score-note').textContent='Making your card… tap again in a moment.';return;}try{if(navigator.canShare?.({files:[storyFile]})){await navigator.share({files:[storyFile],title:CONFIG.title,text:'SKILL ISSUE? '+CONFIG.url});return;}}catch(e){if(e.name==='AbortError')return;}const url=URL.createObjectURL(storyFile),a=document.createElement('a');a.href=url;a.download=storyFile.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);};
$('go').onclick=start;$('pause').onclick=()=>{if(state==='play')screen('pause');else if(state==='pause')start();};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'SOUND ON':'SOUND OFF';$('sound').setAttribute('aria-pressed',String(sound));};$('share').onclick=async()=>{const value=CONFIG.shareText.replace('{BELT}',CONFIG.belts[Math.min(round,4)].name);try{if(navigator.share){await navigator.share({title:CONFIG.title,text:value,url:CONFIG.url});return;}}catch(e){if(e.name==='AbortError')return;}try{await navigator.clipboard.writeText(value);$('share').textContent=CONFIG.texts.copied;}catch{$('copy').textContent=value;}};
const keys={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowRight:[1,0],d:[1,0],D:[1,0],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0]};document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select')||e.target.isContentEditable)return;if(keys[e.key]&&!e.metaKey&&!e.ctrlKey){e.preventDefault();input(...keys[e.key]);}else if(e.code==='Space'&&state==='play'){e.preventDefault();screen('pause');}else if(e.key==='Escape'&&state==='play')screen('pause');});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();input(...b.dataset.dir.split(',').map(Number));}));let touch=null;canvas.addEventListener('pointerdown',e=>{touch={x:e.clientX,y:e.clientY,id:e.pointerId};canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointermove',e=>{if(!touch||touch.id!==e.pointerId)return;const dx=e.clientX-touch.x,dy=e.clientY-touch.y;if(Math.max(Math.abs(dx),Math.abs(dy))<CONFIG.swipePixels)return;input(...(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)]));touch.x=e.clientX;touch.y=e.clientY;});canvas.addEventListener('pointerup',()=>touch=null);canvas.addEventListener('pointercancel',()=>touch=null);document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')screen('pause');});window.addEventListener('blur',()=>{if(state==='play')screen('pause');});new ResizeObserver(fit).observe($('stage'));$('title').textContent=CONFIG.title;document.title=CONFIG.title+' · Corvus Arcade';makeMaze();screen('start');if(challenger)$('copy').textContent=challenger+' CALLED YOU OUT: beat '+challengeScore+'. '+CONFIG.texts.tagline;fit();requestAnimationFrame(frame);
</script></body></html>

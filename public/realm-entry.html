<div class="entry-curtain closed" aria-hidden="true"><i></i><i></i></div>
<main class="entry" id="entry">
  <button type="button" class="lantern" id="lantern" aria-label="Lantern. Drag it, or use the arrow keys, to light up the dark."><span class="lantern-glow" aria-hidden="true"></span><span class="lantern-body" aria-hidden="true"></span></button>
  <a class="dark-thing dark-door realm-enter" href="/" data-dark><span class="door-mark" aria-hidden="true">✦</span><span class="door-word"><span data-i18n="realm.enter">enter the realm</span></span></a>
  <h1 class="sr-only">Corvus. Find the way in with the lantern.</h1>
  <p class="location" id="loc"><span data-i18n="location.label">📍 currently in:</span> <span id="city">Gent</span></p>

  <figure class="entry-scene" id="hero" title="?">
    <img src="/public/inspiration/diogenes.webp" width="768" height="555" alt="Diogenes in his barrel, holding up a lantern, with three dogs beside him.">
  </figure>

  <!-- Hidden in the dark: the lantern finds them. -->
  <div class="dark-thing dark-question" data-dark>
    <p class="dio-who" id="dio-who">Diogenes</p>
    <p class="dio-line" id="dio-line">I’m looking for an honest builder. Are you one?</p>
    <form class="dio-form" id="dio-form" autocomplete="off">
      <label class="sr-only" for="dio-input">Answer Diogenes</label>
      <input id="dio-input" maxlength="400" placeholder="answer him…" enterkeyhint="send">
    </form>
  </div>



  <button type="button" class="dark-thing dark-echo" id="dio-swap" data-dark>or ask Gabe’s echo</button>

  <!-- Small things for whoever wanders with the light. -->
  <span class="dark-thing dark-emoji" style="left:9vw;top:24vh" data-dark aria-hidden="true">🎪</span>
  <span class="dark-thing dark-emoji" style="left:46vw;top:8vh" data-dark aria-hidden="true">🃏</span>
  <span class="dark-thing dark-emoji" style="left:58vw;bottom:9vh" data-dark aria-hidden="true">🐘</span>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your lesson · Curiosity Craft</title><link rel="stylesheet" href="/worldcraft/engine.css"><body><p id="error"></p><script>
(()=>{let lines;try{lines=JSON.parse(sessionStorage.getItem('worldcraft-lesson'));}catch{}if(!lines?.length){document.querySelector('#error').textContent='Upload a plain-text lesson at /worldcraft first.';return;}const quests=Array.from({length:10},(_,i)=>{const line=lines[i%lines.length],words=line.match(/[a-zA-Z]{5,}/g)||['lesson'],word=words.sort((a,b)=>b.length-a.length)[0];return {objective:i%3,kind:'explain',prompt:'Lesson room '+(i+1)+': '+line.replace(word,'_____')+'. Explain the missing idea.',rubric:[[word]],explanation:line,correction:'Read the idea again: '+line};});const c={title:'Your lesson world',hook:'A local text-to-world experiment. Restore ten rooms with your lesson.',objectives:['Recall room 1','Recall room 2','Recall room 3'],quests,precheck:quests.slice(0,3),recall:quests.slice(0,3),npcs:[{name:'Room keeper 1'},{name:'Room keeper 2'},{name:'Room keeper 3'}],restored:'Your lesson restored!'};const config=document.createElement('script');config.type='application/json';config.id='world-config';config.textContent=JSON.stringify(c);document.body.append(config);const engine=document.createElement('script');engine.src='/worldcraft/engine.js';document.body.append(engine);})();
</script></body></html>

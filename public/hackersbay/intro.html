<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06121f">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/public/hackersbay/assets/parrot-flag.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/public/hackersbay/assets/bay.css">
  <title>Intro request | The Hackers Bay</title>
  <script type="module" src="/public/hackersbay/assets/intro-view.js"></script>
</head>
<body class="intro-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-bar wrap">
    <a class="brand" href="/hackersbay"><img src="/public/hackersbay/assets/parrot-flag.svg" width="34" height="34" alt=""><span class="wordmark">The Hackers Bay</span></a>
    <div class="harbor-controls">
      <button class="button sound-switch" id="bay-sound" type="button" aria-pressed="false">Sound off</button>
      <a class="top-link" id="return-to-room" href="/hackersbay/e/boat-hackathon-demo-day">Return to the room</a>
    </div>
  </header>
  <main class="wrap inside" id="main">
    <div class="panel intro-inbox">
      <p class="eyebrow">FICTIONAL RECIPIENT VIEW</p>
      <h1 id="intro-title">You have an intro request.</h1>
      <p id="intro-context" role="status">Opening the request…</p>
      <div class="intro-decisions" id="intro-decisions" hidden>
        <button class="button primary" id="accept-intro" type="button">Accept intro</button>
        <button class="button" id="decline-intro" type="button" aria-label="Walk the plank (decline intro)">Walk the plank</button>
      </div>
      <div id="intro-parrots"></div>
      <p class="mutual-message" id="intro-mutual" role="status" hidden></p>
      <a class="text-link" id="intro-back" href="/hackersbay/e/boat-hackathon-demo-day">Back to the room</a>
    </div>
  </main>
</body>
</html>

<text x="542" y="36" text-anchor="end" fill="#8eb499" font-size="15">tty0</text>
<g fill="#8eb499" font-size="16"><text x="26" y="78" style="--delay:0.15s" class="reveal">bios: init uart0 <tspan fill="#ffc266">[ok]</tspan></text>
<text x="26" y="101" style="--delay:0.85s" class="reveal">load: rust kernel <tspan fill="#ffc266">[ok]</tspan></text></g>

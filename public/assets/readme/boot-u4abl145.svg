<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 568 292" role="img" aria-labelledby="title desc">
<title id="title">Corvus Noctis boot screen</title><desc id="desc">Boot ROM initializes the serial console and loads the Rust kernel. Corvus Noctis v0.2.0 for aarch64 displays its raven and lantern, then waits for login.</desc>
<defs><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 .5H4" stroke="#8cffae" opacity=".065"/></pattern></defs>
<style>
@keyframes reveal{from{opacity:0}to{opacity:1}}
@keyframes bootcursor{0%,76%,84%,92%{opacity:0}80%,88%,96%,100%{opacity:1}}
@media(prefers-reduced-motion:no-preference){.reveal{animation:reveal .12s steps(2,end) var(--delay) both}.cursor{animation:bootcursor 6s steps(1,end) 1 both}}
</style>

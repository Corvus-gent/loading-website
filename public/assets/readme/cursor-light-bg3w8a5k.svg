<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 20" role="img" aria-labelledby="title desc">
<title id="title">Terminal cursor</title><desc id="desc">A blinking block cursor.</desc>
<style>@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:no-preference){rect{animation:blink 1.2s step-end infinite}}</style><rect x="2" y="3" width="10" height="14" fill="#114c31"/>
</svg>

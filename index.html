<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>corvus.gent</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="stylesheet" href="/styles.css" />
  <meta name="description" content="The crow died. The domain didn't." />
  <meta property="og:title" content="corvus.gent" />
  <meta property="og:description" content="The crow died. The domain didn't." />
  <meta property="og:url" content="https://corvus.gent/" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://corvus.gent/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://corvus.gent/og.png" />
</head>
<body>
  <main>
    <div class="wrap home">
      <div class="lang-switcher" id="lang-switcher"></div>
      <img class="hero" id="hero" src="/img/diogenes.svg" title="?" alt="A crow flying towards Diogenes in his barrel, lantern in hand">
      <p class="tagline" data-i18n="home.tagline">still looking for an honest man.</p>
      <p class="location" id="loc"><span data-i18n="location.label">📍 currently in:</span> <span id="city">Gent</span></p>

      <details class="call-drop">
        <summary aria-label="call">📞</summary>
        <p class="cta"><a href="/call/" data-i18n="home.callbtn">want to call with gabe maxxer? 📞</a></p>
      </details>

      <nav aria-label="links">
        <a href="/people/?id=gabe" data-i18n="nav.about">about</a>
        <a href="/sidequests/" data-i18n="nav.sidequests">sidequests</a>
        <a href="/now/" data-i18n="nav.now">now</a>
        <a href="/support/" data-i18n="nav.support">support</a>
        <a href="/wiki/">wiki</a>
      </nav>

      <p class="evolving" data-i18n="home.evolving"></p>
      <p class="term-hint"><a href="#" data-terminal>&gt;_ <span data-i18n="term.hint">press any key</span></a></p>
      <footer><span data-i18n="footer.deceased">corvus · deceased feb 2026 · revived nov 2026</span></footer>
    </div>
  </main>

  <script type="module">
    import { initI18n } from "/js/i18n.js";
    import { setFooterYear } from "/js/utils.js";
    setFooterYear();
    initI18n();
    fetch("/location.json", { cache: "no-store" })
      .then(r => r.json())
      .then(d => { document.getElementById("city").textContent = d.city; })
      .catch(() => {});
    document.getElementById("hero").addEventListener("click", () => {
      document.getElementById("loc").classList.toggle("show");
    });
  </script>
  <script type="module" src="/js/terminal.js"></script>
  <script src="/js/analytics.js"></script>
</body>
</html>

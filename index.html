<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>corvus.gent</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="stylesheet" href="/styles.css?v=8da4ddf17660" />
  <meta name="description" content="The crow died. The domain didn't." />
  <meta property="og:title" content="corvus.gent" />
  <meta property="og:description" content="The crow died. The domain didn't." />
  <meta property="og:url" content="https://corvus.gent/" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://corvus.gent/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://corvus.gent/og.png" />
</head>
<body class="portal">
  <main>
    <div class="wrap home">
      
      <img class="hero" id="hero" width="600" height="340" src="/img/diogenes.svg" title="?" alt="A crow flying towards Diogenes in his barrel, lantern in hand">
      <p class="location" id="loc"><span data-i18n="location.label">📍 currently in:</span> <span id="city">Gent</span></p>



<h1>corvus</h1><a class="realm-enter" href="/realm/" data-i18n="realm.enter">enter the realm</a><a class="realm-skip" href="/realm/" data-i18n="realm.skip" hidden>skip to the realm →</a>


      <p class="term-hint" hidden><a href="#" data-terminal>&gt;_ <span data-i18n="term.hint">press any key</span></a></p>

    </div>
  </main>

  <script type="module">
    import { initI18n } from "/js/i18n.js";
    import { setFooterYear } from "/js/utils.js";
    setFooterYear();
    initI18n();
    fetch("/location.json", { cache: "no-store" })
      .then(r => r.json())
      .then(d => { document.getElementById("city").textContent = d.city; })
      .catch(() => {});
    document.getElementById("hero").addEventListener("click", () => {
      document.getElementById("loc").classList.toggle("show");
    });
  </script>
  <script type="module" src="/js/portal.js?v=906bb87fac3c"></script>
  <script type="module" src="/js/terminal.js?v=51e74279a5db"></script>
  <script src="/js/analytics.js?v=aa7a8b654e2f"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>corvus.gent</title>

  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="stylesheet" href="/styles.css" />
  <meta name="description" content="The crow died. The domain didn't." />
  <meta property="og:title" content="corvus.gent" />
  <meta property="og:description" content="The crow died. The domain didn't." />
  <meta property="og:url" content="https://corvus.gent/" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://corvus.gent/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://corvus.gent/og.png" />
</head>
<body>
  <main>
    <div class="wrap">
      <div class="lang-switcher" id="lang-switcher"></div>
      <div class="tag">corvus.gent</div>

      <h1>Corvus 𓅨</h1>
      <p class="sub" data-i18n="home.sub">The crow died. The domain didn't.</p>
      <p class="location"><span data-i18n="location.label">📍 currently in:</span> <span id="city">Gent</span></p>

      <div id="cta-book" style="display:none">
        <p class="cta"><a id="book-link" href="#" target="_blank" rel="noreferrer" data-i18n="home.book">book a free 15-min call</a></p>
        <p class="sub" id="call60" style="display:none"><a id="book60-link" href="#" target="_blank" rel="noreferrer" data-i18n="home.call60"></a></p>
        <p class="sub" data-i18n="home.broke"></p>
      </div>

      <nav aria-label="links">
        <a href="mailto:gabriel@corvus.gent" data-i18n="nav.contact">contact</a>
        <a href="/people/?id=gabriel" data-i18n="nav.about">about</a>
        <a href="/sidequests/" data-i18n="nav.sidequests">sidequests</a>
        <a href="/now/" data-i18n="nav.now">now</a>
        <a href="/support/" data-i18n="nav.support">support</a>
        <a id="coffee-link" href="#" target="_blank" rel="noreferrer" style="display:none" data-i18n="home.coffee">buy me a coffee</a>
      </nav>

      <p class="term-hint"><a href="#" data-terminal>&gt;_ <span data-i18n="term.hint">press any key</span></a></p>

      <footer>
        © <span id="y"></span> <span data-i18n="footer.deceased">corvus (deceased)</span>
      </footer>
    </div>
  </main>

  <script type="module">
    import { initI18n } from "/js/i18n.js";
    import { setFooterYear } from "/js/utils.js";
    setFooterYear();
    initI18n();
    fetch("/location.json", { cache: "no-store" })
      .then(r => r.json())
      .then(d => { document.getElementById("city").textContent = d.city; })
      .catch(() => {});
    fetch("/site.json", { cache: "no-store" })
      .then(r => r.json())
      .then(c => {
        if (c.booking15) { document.getElementById("book-link").href = c.booking15; document.getElementById("cta-book").style.display = "block"; }
        if (c.booking60) { document.getElementById("book60-link").href = c.booking60; document.getElementById("call60").style.display = "block"; }
        if (c.coffee) { const a = document.getElementById("coffee-link"); a.href = c.coffee; a.style.display = ""; }
      })
      .catch(() => {});
  </script>
  <script type="module" src="/js/terminal.js"></script>
  <script src="/js/analytics.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Books | corvus.gent</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/people/styles.css" />
  <meta name="description" content="People, companies and ideas I'd vouch for." />
  <meta property="og:title" content="Books | corvus.gent" />
  <meta property="og:description" content="People, companies and ideas I'd vouch for." />
  <meta property="og:url" content="https://corvus.gent/support/books/" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://corvus.gent/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://corvus.gent/og.png" />
</head>
<body class="people-page">
  <main>
    <div class="wrap">
      <div class="lang-switcher" id="lang-switcher"></div>
      <div class="tag"><a href="/">corvus.gent</a> / support / books</div>
      <h1 data-i18n="support.books"></h1>
      <section class="person-view-wrap">
        <ul class="contact-list">
          <li>Contagious <span class="sub">(Jonah Berger)</span></li>
        </ul>
        <p class="sub" data-i18n="books.wip"></p>
        <p><a href="#" id="goodreads">goodreads</a></p>
        <p class="sub" id="locked" style="display:none" data-i18n="books.locked"></p>
      </section>
      <script>
        document.getElementById("goodreads").addEventListener("click", e => {
          e.preventDefault();
          document.getElementById("locked").style.display = "block";
          if (window.posthog?.capture) window.posthog.capture("goodreads_locked_click");
        });
      </script>
      <p><a href="/support/" data-i18n="support.back">← support</a></p>
      <footer>© <span id="y"></span> corvus</footer>
    </div>
  </main>
  <script type="module">
    import { initI18n } from "/js/i18n.js";
    import { setFooterYear } from "/js/utils.js";
    setFooterYear();
    initI18n();
  </script>
  <script src="/js/analytics.js"></script>
</body>
</html>

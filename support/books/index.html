<body class="people-page">
  <main>
    <div class="wrap">
      <div class="lang-switcher" id="lang-switcher"></div>
      <div class="tag"><a href="/">corvus.gent</a> / support / books</div>
      <h1 data-i18n="support.books">books</h1>
      <section class="person-view-wrap">
        <ul class="contact-list">
          <li>Contagious <span class="sub">(Jonah Berger)</span></li>
        </ul>
        <p class="sub" data-i18n="books.wip">WIP. More soon.</p>
        <p><a href="#" id="goodreads">goodreads</a></p>
        <div id="locked" style="display:none">
          <p class="sub" data-i18n="books.locked">Inner circle only. Access is granted, not requested.</p>
          <form id="access-form" class="access-form">
            <input type="email" name="email" required placeholder="you@email.com" aria-label="email">
            <button type="submit" data-i18n="books.request">request access</button>
          </form>
          <p class="sub" id="access-done" style="display:none" data-i18n="books.sent">Request received. Don&#x27;t call us, we&#x27;ll call you.</p>
        </div>
      </section>
      <script>
        document.getElementById("goodreads").addEventListener("click", e => {
          e.preventDefault();
          document.getElementById("locked").style.display = "block";
          if (window.posthog?.capture) window.posthog.capture("goodreads_locked_click");
        });
        document.getElementById("access-form").addEventListener("submit", async e => {
          e.preventDefault();
          const email = e.target.email.value;
          try {
            await fetch("/api/access", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email }),
            });
          } catch {}
          e.target.style.display = "none";
          document.getElementById("access-done").style.display = "block";
          if (window.posthog?.capture) window.posthog.capture("goodreads_access_request");
        });
      </script>
      <p><a href="/support/" data-i18n="support.back">← support</a></p>
      <footer>© <span id="y"></span> corvus <a href="/privacy/" data-privacy-link>privacy</a></footer>
    </div>
  </main>
  <script type="module">
    import { initI18n } from "/js/i18n.js?v=20261106-ranks1";
    import { setFooterYear } from "/js/utils.js";
    setFooterYear();
    initI18n();
  </script>
  <script src="/js/analytics.js?v=f2643794512b"></script>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="ui-monospace, Menlo, monospace">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3c4" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffd76a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- ground -->
  <line x1="20" y1="300" x2="580" y2="300" stroke="#333" stroke-width="1"/>
  <!-- crow trail -->
  <path d="M40 70 Q160 40 250 95" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4 7"/>
  <!-- crow -->
  <g transform="translate(250 95) rotate(14) scale(0.9)" fill="#141414" stroke="#d8d8d8" stroke-width="1.6" stroke-linejoin="round">
    <path d="M0 0 C18 -28 46 -34 64 -10 C74 -24 104 -30 124 -6 C104 -10 86 -4 66 6 C46 -4 22 -9 0 0Z"/>
    <ellipse cx="66" cy="4" rx="16" ry="7"/>
    <circle cx="82" cy="0" r="6"/>
    <path d="M87 -2 L98 1 L87 3Z"/>
  </g>
  <!-- barrel on its side -->
  <g stroke="#bbb" stroke-width="2" fill="#0d0d0d">
    <rect x="330" y="215" width="200" height="85" rx="38"/>
    <ellipse cx="368" cy="257" rx="24" ry="40" fill="#000"/>
    <line x1="420" y1="216" x2="420" y2="299"/>
    <line x1="480" y1="216" x2="480" y2="299"/>
  </g>
  <!-- diogenes -->
  <g stroke="#e8e8e8" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="368" cy="196" r="13" fill="#000"/>
    <path d="M368 209 L368 262"/>
    <path d="M368 225 L330 214"/>
    <path d="M330 214 L326 232"/>
  </g>
  <!-- lantern -->
  <circle cx="326" cy="244" r="48" fill="url(#glow)"/>
  <rect x="319" y="234" width="14" height="20" rx="3" fill="#ffd76a" stroke="#e8e8e8" stroke-width="2"/>
</svg>

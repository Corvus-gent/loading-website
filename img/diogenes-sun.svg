<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320">
  <defs>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d6"/>
      <stop offset="45%" stop-color="#ffd76a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- sun -->
  <circle cx="500" cy="80" r="70" fill="url(#sun)"/>
  <circle cx="500" cy="80" r="26" fill="#ffe89a"/>
  <g stroke="#ffd76a" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="500" y1="22" x2="500" y2="38"/><line x1="500" y1="122" x2="500" y2="138"/>
    <line x1="442" y1="80" x2="458" y2="80"/><line x1="542" y1="80" x2="558" y2="80"/>
    <line x1="459" y1="39" x2="470" y2="50"/><line x1="530" y1="110" x2="541" y2="121"/>
    <line x1="459" y1="121" x2="470" y2="110"/><line x1="530" y1="50" x2="541" y2="39"/>
  </g>
  <!-- ground -->
  <line x1="20" y1="280" x2="580" y2="280" stroke="#333"/>
  <!-- Alexander's shadow falling on the barrel -->
  <path d="M300 280 L120 280 L150 268 Z" fill="#1c1c1c"/>
  <!-- Alexander standing, blocking the sun -->
  <g stroke="#9a9a9a" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="300" cy="150" r="13" fill="#000"/>
    <path d="M300 163 L300 225 M300 225 L288 280 M300 225 L312 280 M300 180 L280 205 M300 180 L322 200"/>
    <path d="M287 140 L300 128 L313 140" stroke="#ffd76a"/>
  </g>
  <!-- barrel -->
  <g stroke="#bbb" stroke-width="2" fill="#0d0d0d">
    <rect x="60" y="200" width="190" height="80" rx="36"/>
    <ellipse cx="226" cy="240" rx="22" ry="38" fill="#000"/>
    <line x1="110" y1="201" x2="110" y2="279"/>
    <line x1="165" y1="201" x2="165" y2="279"/>
  </g>
  <!-- Diogenes leaning out of the barrel, waving him away -->
  <g stroke="#e8e8e8" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="226" cy="190" r="12" fill="#000"/>
    <path d="M226 202 L222 248 M224 214 L256 196 M256 196 L262 182"/>
  </g>
</svg>

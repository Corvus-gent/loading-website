name: Leadhunter checks
on:
  pull_request:
  push:
    branches: [leadhunter-offers]
permissions:
  contents: read
jobs:
  leads:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:leads
      - run: npx playwright install --with-deps chromium
      - run: node tests/leads/browser.mjs

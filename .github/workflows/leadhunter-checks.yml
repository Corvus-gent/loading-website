name: Leadhunter checks
on:
  pull_request:
  push:
    branches: [leadhunter-offers, 'claude/leadhunter-**']
permissions:
  contents: read
jobs:
  leads:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:leads
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/leads/browser.mjs
      - name: Real login flow (DuckDuckGo iOS/Android, Safari, Chrome; real Origin headers)
        run: node tests/leads/login-flow.mjs chromium,webkit

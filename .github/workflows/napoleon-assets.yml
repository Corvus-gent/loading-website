name: Publish Napoleon assets
on:
  push:
    branches: ['codex/napoleon-gate']
    paths: ['.github/workflows/napoleon-assets.yml']
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Reproduce the public-domain artwork
        run: |
          curl -fL --retry 2 'https://upload.wikimedia.org/wikipedia/commons/3/3a/Jacques-Louis_David_-_Napoleon_Crossing_the_Alps_-_Schloss_Charlottenburg.jpg' -o /tmp/napoleon.jpg
          node tools/build-napoleon-art.mjs /tmp/napoleon.jpg
      - name: Add remaining assets, one Contents API request per file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, json, base64
          for p in sorted(pathlib.Path('img/army').glob('napoleon-*'))+[pathlib.Path('img/army/gate-napoleon-og.jpg')]:
              if p.suffix not in ['.avif','.webp','.jpg']: continue
              endpoint='repos/'+__import__('os').environ['GITHUB_REPOSITORY']+'/contents/'+str(p)
              current=subprocess.run(['gh','api',endpoint+'?ref=codex/napoleon-gate'],capture_output=True,text=True)
              if current.returncode==0:
                  print('Already published:',p.name)
                  continue
              body={'message':'Add '+p.name,'branch':'codex/napoleon-gate','content':base64.b64encode(p.read_bytes()).decode()}
              subprocess.run(['gh','api','-X','PUT',endpoint,'--input','-','--silent'],input=json.dumps(body),text=True,check=True)
              print('Published:',p.name)
          PY

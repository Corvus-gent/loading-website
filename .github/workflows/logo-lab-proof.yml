name: Capture logo lab proofs
on:
  push:
    branches: [design/logo-lab]
    paths: ['.github/workflows/logo-lab-proof.yml','tools/logo-lab/proofs.cjs']
permissions:
  contents: write
jobs:
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node tools/site/build-all.mjs
      - run: npx playwright install --with-deps chromium
      - run: node tools/logo-lab/proofs.cjs 02-character
      - name: Save captured proofs on the design branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/logo-lab/rounds/02-character/*.png
          git diff --cached --quiet || git commit -m "Capture desktop, mobile and fifty application proofs"
          git push origin HEAD:design/logo-lab

name: Publish WebP hero assets
on:
  push:
    branches: ['codex/pidgy-ui']
    paths: ['.github/workflows/webp-assets.yml']
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: |
          curl -fL --retry 2 'https://upload.wikimedia.org/wikipedia/commons/3/3a/Jacques-Louis_David_-_Napoleon_Crossing_the_Alps_-_Schloss_Charlottenburg.jpg' -o /tmp/napoleon.jpg
          node tools/build-napoleon-art.mjs /tmp/napoleon.jpg
      - name: Publish quality-78 WebP assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, json, base64, os, hashlib
          for p in sorted(pathlib.Path('img/army').glob('napoleon-*.webp'))+[pathlib.Path('img/army/gate-napoleon-og.webp')]:
              endpoint='repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/'+str(p)
              current=subprocess.run(['gh','api',endpoint+'?ref=codex/pidgy-ui'],capture_output=True,text=True)
              old=json.loads(current.stdout).get('sha') if current.returncode==0 else None
              content=p.read_bytes()
              digest=hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
              if old==digest: continue
              body={'message':'Publish quality-78 '+p.name,'branch':'codex/pidgy-ui','content':base64.b64encode(content).decode()}
              if old:body['sha']=old
              subprocess.run(['gh','api','-X','PUT',endpoint,'--input','-','--silent'],input=json.dumps(body),text=True,check=True)
              print('Published:',p.name)
          PY

name: Rust migration contracts
on:
  pull_request:
  push:
    branches: ['codex/rust-migration']
permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Install pinned Rust toolchain and local Redis
        run: |
          rustup show
          sudo apt-get update -qq
          sudo apt-get install -y redis-server
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo check --locked -p corvus-browser --target wasm32-unknown-unknown
      - run: cargo build --locked --bins
      - run: node tools/rust/parity.mjs
      - run: node tests/rust/auth-parity.mjs
      - run: tools/rust/build-browser.sh
      - run: npx playwright install --with-deps chromium
      - run: node tests/rust/browser.mjs
      - name: Keep generated parity fixtures reproducible
        run: git diff --exit-code -- rust/fixtures

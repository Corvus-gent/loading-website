      - run: node tests/rust/army-render.mjs
      - run: node tests/rust/army-browser.mjs
      - run: node tests/rust/site-browser.mjs
      - run: node tests/rust/progressive-delivery.mjs
      - run: node tests/rust/site-built.mjs
      - run: node tests/rust/cv-browser.mjs
      - run: node tests/rust/philosophy-browser.mjs
      - run: node tests/rust/page-copy-browser.mjs

name: Feature checks
on:
  pull_request:
  push:
    branches: ['codex/**', 'claude/**', 'daily/**']
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Syntax and locale contracts
        run: |
          git ls-files -z '*.js' '*.mjs' | xargs -0 -n1 node --check
          node tools/check-locales.mjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/smoke-ci.mjs
      - run: python3 tools/check-links.py
      - name: Generate search index from sources
        run: python3 tools/build-search.py
      - uses: actions/upload-artifact@v4
        with:
          name: generated-search-index
          path: search-index.json

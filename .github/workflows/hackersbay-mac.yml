name: Hackers Bay Mac release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hackersbay-mac-release
jobs:
  package:
    if: github.ref_name == 'main'
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: hackersbay-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: hackersbay-app/package-lock.json
      - run: npm ci
      - run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify app bundles and disk images
        run: |
          codesign --verify --deep --strict "dist/mac-arm64/The Hackers Bay.app"
          codesign --verify --deep --strict "dist/mac/The Hackers Bay.app"
          for image in dist/HackersBay-arm64.dmg dist/HackersBay-x64.dmg; do
            test -s "$image"
            hdiutil verify "$image"
          done
      - name: Publish unsigned demo release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=hackersbay-demo-v0.1.0
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title 'The Hackers Bay demo' --prerelease --notes 'Unsigned macOS wrappers for Boat Hackathon Demo Day. Choose arm64 for Apple Silicon or x64 for Intel. The app opens https://corvus.gent/hackersbay.'
          fi
          gh release upload "$tag" dist/HackersBay-arm64.dmg dist/HackersBay-x64.dmg --clobber

name: Set location

on:
  workflow_dispatch:
    inputs:
      city:
        description: "Where are you?"
        required: true
        type: choice
        options:
          - Gent
          - Brussel
          - Leuven
          - San Francisco
          - nowhere

permissions:
  contents: write

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update location.json
        run: |
          echo "{ \"city\": \"${{ inputs.city }}\" }" > location.json
          git config user.name "corvus-bot"
          git config user.email "gabriel@corvus.gent"
          git add location.json
          git commit -m "📍 currently in: ${{ inputs.city }}" || echo "no change"
          git push
